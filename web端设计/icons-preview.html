const GROUPS = [
  {name:"菜单 / 活动", ids:["feed","sit","train","clean","cure","status","dig","game","dungeon","home","bag","shop","daily","activity","settings"]},
  {name:"游戏厅", ids:["dice","whack","game_fish","memory","race"]},

  {name:"物品 · 食物 / 丹药 / 材料", ids:["baozi","fish","feast","pill","page","iron","tassel","steel","shard","xj_zt"]},
  {name:"物品 · 装备 / 家具", ids:["w_sword","w_pick","a_robe","a_charm","t_jade","t_gourd","d_plant","d_screen","d_lamp"]}
];
let pxCtx = null;
function px(x,y,w,h,c){ pxCtx.fillStyle=c; pxCtx.fillRect(x,y,w,h); }
function tile(id, sel, scale){
  const c=document.createElement("canvas"); c.width=64; c.height=64;
  pxCtx=c.getContext("2d"); pxCtx.imageSmoothingEnabled=false;
  pxCtx.fillStyle="#141824"; pxCtx.fillRect(0,0,64,64);
  const s=scale||4; drawSpr(id, (64-16*s)/2, (64-16*s)/2, s, sel?SPR_SEL:null);
  return c;
}
const root=document.getElementById("root");
GROUPS.forEach(g=>{
  const h=document.createElement("h2"); h.textContent=g.name; root.appendChild(h);
  const grid=document.createElement("div"); grid.className="grid";
  g.ids.forEach(id=>{
    const cell=document.createElement("div"); cell.className="cell";
    cell.appendChild(tile(id,false,4));
    const nm=document.createElement("div"); nm.className="nm"; nm.textContent=NAMES[id]||id;
    cell.appendChild(nm);
    const sid=document.createElement("div"); sid.className="id"; sid.textContent=id;
    cell.appendChild(sid);
    grid.appendChild(cell);
  });
  root.appendChild(grid);
});
