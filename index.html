<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剑网三拓麻歌子 · 网页原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f2ede3;
    background-image: radial-gradient(#e5ddcc 1px, transparent 1px);
    background-size: 24px 24px;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; gap: 24px; flex-wrap: wrap;
  }
  /* ---------- 机身 ---------- */
  .device {
    background: linear-gradient(160deg, #2b2f3a, #1c1f28);
    border-radius: 36px;
    padding: 18px 18px 14px;
    box-shadow: 0 18px 40px rgba(30,30,40,.45), inset 0 2px 4px rgba(255,255,255,.12);
    border: 3px solid #3c4152;
    width: 540px;
    max-width: calc(100vw - 16px);
  }
  .device-title {
    text-align: center; color: #d8c68a; font-size: 14px; letter-spacing: 4px;
    margin-bottom: 10px; font-weight: bold;
  }
  .screen-frame {
    background: #0c0e14;
    border-radius: 14px;
    padding: 10px;
    border: 2px solid #444a5e;
    box-shadow: inset 0 0 18px rgba(0,0,0,.8);
  }
  canvas#screen {
    display: block; width: 100%; height: auto; aspect-ratio: 160 / 128;
    image-rendering: pixelated;
    border-radius: 6px;
    background: #10131c;
    cursor: pointer;
  }
  /* ---------- 真实尺寸模式（1 canvas 像素 = 1 CSS 像素） ---------- */
  body.real-size .device { width: auto; }
  body.real-size canvas#screen { width: 160px; height: 128px; }
  .size-toggle {
    display: block; margin: 10px auto 0; padding: 4px 14px;
    background: #262a38; color: #8a92ad; border: 1px solid #3c4152; border-radius: 14px;
    font-size: 11px; cursor: pointer; user-select: none;
  }
  .size-toggle.on { color: #f5e9b8; border-color: #d8c68a; }
  /* ---------- 控制 ---------- */
  .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 0 8px; }
  .dpad { display: flex; flex-direction: column; gap: 8px; }
  .btn.d { width: 56px; height: 42px; border-radius: 12px; font-size: 15px; }
  .btns { display: flex; gap: 14px; }
  .btn {
    width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8b4c8, #b86888 65%, #8a4a68);
    border: 3px solid #5a3048; color: #4a2840;
    font-size: 20px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,.45), inset 0 2px 5px rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center;
    user-select: none; touch-action: manipulation;
    transition: transform .06s;
  }
  .btn:active { transform: translateY(2px) scale(.96); }
  .hint { color: #8a8fa5; font-size: 11px; text-align: center; margin-top: 10px; }
  /* ---------- 说明面板 ---------- */
  .panel {
    background: #fffdf6; border: 2px solid #d8cbb0; border-radius: 14px;
    width: 300px; max-width: calc(100vw - 16px);
    padding: 18px 20px; font-size: 13px; color: #4a4335;
    box-shadow: 0 8px 20px rgba(60,50,30,.15);
    line-height: 1.75;
  }
  .panel h2 { font-size: 16px; color: #6a5a2a; border-bottom: 2px solid #d8c68a; padding-bottom: 6px; margin-bottom: 10px; }
  .panel b { color: #8a5a1a; }
  .panel .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .panel select, .panel button {
    padding: 4px 10px; border-radius: 8px; border: 1px solid #c8b890;
    background: #f5eeda; cursor: pointer; font-size: 12px;
  }
  .panel button:hover { background: #eadfb8; }
  kbd { background: #2b2f3a; color: #d8c68a; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: monospace; }
</style>
</head>
<body>

<div class="device">
  <div class="device-title">剑 网 三 · 拓 麻 歌 子</div>
  <div class="screen-frame">
    <canvas id="screen" width="160" height="128"></canvas>
  </div>
  <div class="controls">
    <div class="dpad">
      <div class="btn d" id="btnUp">▲</div>
      <div class="btn d" id="btnDown">▼</div>
    </div>
    <div class="btns">
      <div class="btn" id="btnA">A</div>
      <div class="btn" id="btnB">B</div>
    </div>
  </div>
  <div class="hint">▲▼ 选图标 · A 进入 · B 返回（主页 B = 状态手札）</div>
  <button class="size-toggle" id="sizeToggle">切换：真实尺寸 160×128</button>
</div>

<div class="panel">
  <h2>江湖生存指南</h2>
  <div>你的侠士需要<b>体力</b>与<b>心情</b>维持，<b>打木桩</b>涨修为但耗体力，<b>打坐</b>回心情。</div>
  <div>⚠️ <b>狼牙袭击</b>会丢下狼藉（心情翻倍下滑），<b>中毒</b>不治会转为<b>重伤卧床</b>，记得用药！</div>
  <div>✨ 偶尔触发<b>奇遇</b>，白捡修为。修为攒够就晋见称号。</div>
  <div class="row">
    时间流速
    <select id="speed">
      <option value="60">体验 ×60（推荐）</option>
      <option value="600">快进 ×600</option>
      <option value="1">真实 ×1</option>
    </select>
  </div>
  <div class="row">
    <label><input type="checkbox" id="mute"> 静音</label>
    <button id="reset">重新开号（清档）</button>
  </div>
  <div style="margin-top:8px; color:#9a8f78; font-size:11px;">存档自动保存在浏览器 localStorage，关页面不丢。</div>
</div>

<script>
"use strict";
/* ================= 基础 ================= */
const W = 160, H = 128;
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

const SECTS = {
  cy: { name: "纯阳", robe: "#4a8db8", trim: "#e8eef5", accent: "#bfe3ff" },
  tc: { name: "天策", robe: "#a53a3a", trim: "#e8c860", accent: "#ffb0a0" },
  qx: { name: "七秀", robe: "#d16a9a", trim: "#f5e5f2", accent: "#ffc0e0" },
  sl: { name: "少林", robe: "#a08040", trim: "#e8d8b0", accent: "#e8c890" },
};
const TITLES = [
  { exp: 0,   t: "初入江湖" },
  { exp: 50,  t: "小有名气" },
  { exp: 150, t: "名动一方" },
  { exp: 350, t: "威震八方" },
  { exp: 700, t: "天下无双" },
];
const FEEDS = [
  { id: "baozi", name: "包子",   gain: 15, cd: 12 },
  { id: "fish",  name: "蒸鱼",   gain: 30, cd: 25 },
  { id: "feast", name: "烧尾宴", gain: 50, cd: 60 },
];
const HOME_NAMES = ["荒地", "草庐", "木屋", "庭院", "山庄"];
const SPEEDS = { 60: 60, 600: 600, 1: 1 };

/* ================= 状态 ================= */
let S = null;
let speedF = 60;
let page = "sect";            // sect | main | feed | status
let menuIdx = 0;
let feedIdx = 0;
let frame = 0;
let toast = null;             // {text, until}
let sparkles = [];
let selectLock = 0;           // 键盘重复节流
let downGraceH = 0;           // 中毒累计游戏小时

function newState() {
  return {
    sect: null,
    hunger: 80, mood: 80, exp: 0, coins: 20, homeLv: 0,
    poisoned: false, down: false, mess: 0, dungeonUntil: 0,
    bornTs: Date.now(), lastTs: Date.now(),
    cool: {}, poisonedH: 0,
  };
}
function save() { S.lastTs = Date.now(); localStorage.setItem("jx3tama", JSON.stringify(S)); }
function load() {
  try {
    const raw = localStorage.getItem("jx3tama");
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    S = Object.assign(newState(), parsed);   // 旧档兼容：新字段自动补默认值
    if (!S.sect) return false;
    // 数值字段防 NaN 清洗
    ["hunger", "mood", "exp", "coins", "homeLv"].forEach(k => S[k] = +S[k] || 0);
    S.dungeonUntil = +S.dungeonUntil || 0;
    S.cool = S.cool || {}; S.poisonedH = +S.poisonedH || 0;
    // 离线结算：最多按 2 游戏小时衰减
    const elapsed = Math.min((Date.now() - (S.lastTs || Date.now())) / 1000, 7200);
    applyTime(elapsed, 60, true);
    return true;
  } catch (e) { return false; }
}
const titleOf = exp => { for (let i = TITLES.length - 1; i >= 0; i--) if (exp >= TITLES[i].exp) return TITLES[i]; return TITLES[0]; };
const nextTitle = exp => TITLES.find(t => t.exp > exp) || null;
const cooling = id => (S.cool[id] || 0) > Date.now();

/* ================= 音效 ================= */
let muted = false;
let AC = null;
function beep(freq, dur = 0.08, type = "square", vol = 0.15) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  ok:    () => { beep(880, .06); beep(1320, .08); },
  err:   () => beep(160, .15, "sawtooth"),
  eat:   () => { beep(520, .06); beep(660, .06); beep(780, .08); },
  train: () => { beep(300, .05, "square", .12); beep(220, .07, "square", .12); },
  up:    () => { [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => beep(f, .1), i * 90)); },
  alert: () => { beep(940, .1); setTimeout(() => beep(940, .1), 160); },
};

/* ================= 时间推进 ================= */
function applyTime(dtSec, f, silent) {
  const gh = dtSec * f / 3600;               // 经过的游戏小时
  if (gh <= 0) return;
  let hMul = 1, mMul = 1;
  if (S.poisoned) hMul *= 2;
  if (S.mess > 0) mMul *= 2;
  if (S.down) { hMul *= 0.4; mMul *= 0.4; }
  mMul *= 1 - 0.15 * (S.homeLv || 0);        // 家园等级降低心情流失
  S.hunger = Math.max(0, S.hunger - 9 * gh * hMul);
  S.mood   = Math.max(0, S.mood  - 7 * gh * mMul);

  // 副本结算
  if (S.dungeonUntil > 0 && Date.now() >= S.dungeonUntil) {
    S.dungeonUntil = 0;
    if (!silent) {
      const win = Math.random() < Math.min(0.9, 0.4 + S.exp / 500 + S.hunger / 300);
      if (win) {
        const c = 18 + Math.floor(Math.random() * 24), e = 18 + Math.floor(Math.random() * 16);
        S.coins += c; S.exp += e;
        toastMsg("副本通关！金币 +" + c + "，修为 +" + e, sfx.up);
        for (let i = 0; i < 10; i++) sparkles.push({ x: 50 + Math.random() * 60, y: 35 + Math.random() * 40, life: 30 + Math.random() * 15 });
        checkTitle();
      } else {
        S.mood = Math.max(0, S.mood - 10); S.exp += 5;
        toastMsg("团灭了…侠士灰头土脸（修为+5）", sfx.err);
      }
    }
  }

  if (!S.down && !S.poisoned && !silent) {
    if (Math.random() < 0.5 * gh && S.mess < 3) { S.mess++; toastMsg("狼牙袭击！现场一片狼藉…", sfx.alert); }
    if (Math.random() < 0.12 * gh) { S.poisoned = true; S.poisonedH = 0; toastMsg("中毒了！快用「用药」解毒！", sfx.alert); }
    if (Math.random() < 0.10 * gh) {
      const gains = [8, 12, 20];
      const g = gains[Math.floor(Math.random() * gains.length)];
      S.exp += g;
      toastMsg("奇遇：拾得《剑意残页》，修为 +" + g, sfx.ok);
    }
  }
  if (S.poisoned && !S.down) {
    S.poisonedH += gh;
    if (S.poisonedH >= 3) {
      S.down = true; S.poisoned = false;
      toastMsg("中毒过深，侠士重伤卧床！快「用药」救治！", sfx.alert);
    }
  }
  checkDown("饿");
  checkDown("郁");
  checkTitle();
}
function checkDown(kind) {
  const low = kind === "饿" ? S.hunger : S.mood;
  if (low <= 0 && !S.down && !S.poisoned) {
    if (!S._lowH) S._lowH = 0; else S._lowH += 1;
    if (S._lowH > 60) { // 约 1 游戏小时维持 0
      S.down = true; S._lowH = 0;
      toastMsg("侠士" + (kind === "饿" ? "饿到" : "郁到") + "重伤卧床！用药并好好照料！", sfx.alert);
    }
  } else if (low > 10) S._lowH = 0;
}
function checkTitle() {
  const t = titleOf(S.exp);
  if (S._lastTitle && S._lastTitle !== t.t) {
    toastMsg("晋见！称号晋升为「" + t.t + "」！", sfx.up);
    for (let i = 0; i < 14; i++) sparkles.push({ x: 60 + Math.random() * 40, y: 40 + Math.random() * 40, life: 30 + Math.random() * 20 });
  }
  S._lastTitle = t.t;
}
function toastMsg(text, sfxFn) { toast = { text, until: Date.now() + 2800 }; if (sfxFn) sfxFn(); }

/* ================= 行为 ================= */
const MENU = [
  { id: "status",  label: "状态", desc: "侠士手札" },
  { id: "daily",   label: "日常", desc: "今日剑网三日常" },
  { id: "feed",    label: "喂食", desc: "挑一份菜" },
  { id: "sit",     label: "打坐", desc: "心情+20 修为+3" },
  { id: "train",   label: "木桩", desc: "修为+12 耗体力" },
  { id: "dig",     label: "挖宝", desc: "挖宝得金币" },
  { id: "clean",   label: "打扫", desc: "清理狼藉" },
  { id: "cure",    label: "用药", desc: "解毒/治重伤" },
  { id: "home",    label: "家园", desc: "升级宅子" },
];
const DAILY_SERVER = "梦江南";   // jx3api 查询的区服，可改
function canAct() {
  if (S.down)  return "重伤卧床，只能用药救治！";
  if (S.poisoned) return "中毒中，先用药解毒！";
  if (S.dungeonUntil > Date.now()) return "副本进行中，侠士正在拼命！";
  return null;
}
function doAct(id, sub) {
  const block = canAct();
  if (block && id !== "cure" && id !== "status") { toastMsg(block, sfx.err); return; }
  const now = Date.now();
  switch (id) {
    case "feed": {
      const f = FEEDS[sub];
      if (cooling("feed_" + f.id)) { toastMsg(f.name + "还没凉透，稍后再吃", sfx.err); return; }
      S.hunger = Math.min(100, S.hunger + f.gain);
      S.mood = Math.min(100, S.mood + 5);
      S.cool["feed_" + f.id] = now + f.cd * 1000;
      if (Math.random() < 0.25 && S.mess < 3) { S.mess++; toastMsg("吃剩的骨头丢了一地…记得打扫", null); }
      else toastMsg("侠士吃下" + f.name + "，气力恢复！", sfx.eat);
      break;
    }
    case "sit":
      if (cooling("sit")) { toastMsg("气息未定，稍后再打坐", sfx.err); return; }
      S.mood = Math.min(100, S.mood + 20);
      S.hunger = Math.max(0, S.hunger - 3);
      S.exp += 3;
      S.cool.sit = now + 15000;
      toastMsg("打坐吐纳，心境澄明（修为+3）", sfx.ok);
      break;
    case "train":
      if (S.hunger < 20) { toastMsg("饿得握不动剑了，先吃点东西", sfx.err); return; }
      if (cooling("train")) { toastMsg("木桩刚打完，歇口气", sfx.err); return; }
      S.exp += 12; S.hunger = Math.max(0, S.hunger - 8); S.mood = Math.max(0, S.mood - 5);
      S.cool.train = now + 25000;
      toastMsg("打木桩一百式，修为 +12！", sfx.train);
      break;
    case "clean":
      if (S.mess <= 0) { toastMsg("屋里挺干净的，无需打扫", sfx.err); return; }
      S.mess = 0; S.mood = Math.min(100, S.mood + 5); S.exp += 1;
      toastMsg("打扫完毕，窗明几净（修为+1）", sfx.ok);
      break;
    case "cure":
      if (!S.down && !S.poisoned) { toastMsg("侠士好得很，不用吃药", sfx.err); return; }
      if (cooling("cure")) { toastMsg("药效未过，稍等片刻", sfx.err); return; }
      S.poisoned = false; S.down = false; S.poisonedH = 0; S._lowH = 0;
      S.hunger = Math.max(S.hunger, 30); S.mood = Math.min(100, S.mood + 10);
      S.cool.cure = now + 10000;
      toastMsg("九花玉露丸下肚，满血复活！", sfx.up);
      break;
    case "dig": {
      if (cooling("dig")) { toastMsg("铁锹都挖冒烟了，歇会儿再挖", sfx.err); return; }
      if (S.hunger < 10) { toastMsg("饿得举不起锹，先吃点东西", sfx.err); return; }
      S.hunger = Math.max(0, S.hunger - 6);
      S.cool.dig = now + 30000;
      const r = Math.random();
      if (r < 0.55) { const g = 5 + Math.floor(Math.random() * 12); S.coins += g; toastMsg("挖到 " + g + " 金币！", sfx.ok); }
      else if (r < 0.80) { S.coins += 10; S.exp += 3; toastMsg("挖出一本《剑意残页》，修为 +3！", sfx.up); }
      else if (r < 0.93) { toastMsg("挖了半天，只有一块石头…", sfx.err); }
      else if (S.mess < 3) { S.mess++; toastMsg("挖塌了土堆，弄得到处是泥…记得打扫", sfx.err); }
      else { toastMsg("挖到一块碎瓦，正好补屋顶", sfx.ok); }
      break;
    }
    case "home":
      page = "home"; sfx.ok(); return;
    case "daily":
      page = "daily"; sfx.ok();
      if (!dailyData && !dailyErr) fetchDaily();
      return;
    case "status":
      page = "status"; sfx.ok(); return;
  }
  page = "main";
}
/* 从日常页发起打本（副本已从主菜单移除） */
function startDungeon(name) {
  const now = Date.now();
  const block = canAct();
  if (block) { toastMsg(block, sfx.err); return; }
  if (S.hunger < 30) { toastMsg("体力不足 30，下副本会送人头", sfx.err); return; }
  if (cooling("dungeon")) { toastMsg("侠士刚出本，缓缓再战", sfx.err); return; }
  S.hunger = Math.max(0, S.hunger - 12);
  S.mood = Math.max(0, S.mood - 6);
  S.cool.dungeon = now + 60000;
  S.dungeonUntil = now + 10000;
  toastMsg("进入副本【" + (name || "冤魂洞") + "】！战斗中…", sfx.train);
  save();
}

/* ================= 像素绘制 ================= */
function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function text(str, x, y, c, size) {
  ctx.font = (size || 9) + "px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = c; ctx.textBaseline = "top";
  ctx.fillText(str, x, y);
}
function textC(str, cx, y, c, size) {
  ctx.font = (size || 9) + "px 'Microsoft YaHei', sans-serif";
  const w = ctx.measureText(str).width;
  ctx.fillStyle = c; ctx.textBaseline = "top";
  ctx.fillText(str, Math.round(cx - w / 2), y);
}

/* --- 背景（多画面布局：主界面为纯底色，场景画在视窗里） --- */
function drawScene(t) {
  const gh = (Date.now() - S.bornTs) / 1000 * speedF / 3600;
  px(0, 0, W, H, "#141824");
  return gh % 24;
}

/* --- 狼藉（画在视窗地面） --- */
function drawMess() {
  for (let i = 0; i < S.mess; i++) {
    const x = 16 + i * 14;
    px(x, 59, 8, 4, "#6a5a3a"); px(x + 1, 57, 6, 2, "#8a7a52");
    px(x + 2, 55, 3, 2, "#8a7a52");
  }
}

/* --- 侠士小人（程序化像素，单位 u=2） --- */
function drawPet(pose, pox = 70, poy = 32) {
  const u = 2;
  const C = SECTS[S.sect] || SECTS.cy;
  const bob = pose === "idle" ? (Math.floor(frame / 30) % 2) : 0;
  const ox = pox, oy = poy + bob * 2;
  const P = (x, y, w, h, c) => px(ox + x * u, oy + y * u, w * u, h * u, c);
  const hair = "#26262e", skin = "#f2c9a0", dark = "#1a1a22";

  if (pose === "down") { // 重伤卧床
    P(1, 10, 12, 3, C.robe);            // 躺倒的身体

    P(12, 10, 1, 1, "#803030");

    P(6, 7, 3, 1, "#6a8a4a");           // 苦脸嘴
    P(3, 14, 9, 2, "#3a3a44");          // 腿
    // 头顶眩晕螺旋
    const a = frame / 10;

    px(x0 - 2, 46, 16, 3, "#6a4a2a"); px(x0 - 2, 56, 16, 3, "#6a4a2a");
    const punch = Math.floor(frame / 10) % 2;
    P(3, 7, 9, 6, C.robe);
    P(4, 2, 7, 6, skin);
    P(3, 1, 9, 2, hair); P(6, 0, 3, 2, hair);
    P(5, 4, 1, 1, dark); P(8, 4, 1, 1, dark);
    P(3, 13, 9, 3, "#3a3a44");

    // 汗滴
    if (punch) { px(ox + 2 * u, oy + 1 * u, 2, 3, "#9ad0e8"); }

  }
  if (pose === "dig") { // 挖宝

    P(3, 8, 9, 6, C.robe);
    P(4, 4, 7, 5, skin);
    P(3, 3, 9, 2, hair); P(6, 2, 3, 2, hair);

    else    { P(11, 10, 2, 6, "#8a6a40"); P(11, 15, 4, 2, "#b8c0d0"); } // 插地
    if (!sw) { P(7, 15, 6, 2, "#5a4a30"); } // 土堆

  }
  if (pose === "dungeon") { // 副本战斗
    const mx = 112 + (Math.floor(frame / 14) % 2);

    px(mx + 3, 42, 2, 2, "#e8d840"); px(mx + 8, 42, 2, 2, "#e8d840");
    px(mx - 2, 38, 3, 4, "#2e4a24"); px(mx + 12, 38, 3, 4, "#2e4a24");

    P(4, 2, 7, 6, skin);
    P(3, 1, 9, 2, hair); P(6, 0, 3, 2, hair);
    P(5, 4, 1, 1, dark); P(8, 4, 1, 1, dark);
    P(3, 13, 9, 3, "#3a3a44");
    if (slash) { P(11, 5, 5, 2, C.trim); px(ox + 16 * u, oy + 5 * u, 8, 2, "#e8f0ff"); } // 挥剑+剑光
    else { P(10, 8, 4, 2, skin); }

  // idle
  P(3, 7, 9, 6, C.robe);
  P(5, 2, 7, 6, skin);
  P(4, 1, 9, 2, hair); P(7, 0, 3, 2, hair);
  const blink = frame % 160 < 8;

  else { P(6, 5, 1, 1, dark); P(9, 5, 1, 1, dark); }

  P(3, 13, 4, 3, "#3a3a44"); P(8, 13, 4, 3, "#3a3a44"); // 腿
  P(2, 8, 2, 4, C.robe); P(11, 8, 2, 4, C.robe);        // 手臂

  ctx.strokeStyle = "#b8c0d0"; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(ox + 2 * u, oy + 2 * u); ctx.lineTo(ox + 12 * u, oy + 9 * u);
  ctx.stroke();
  px(ox + 12 * u, oy + 9 * u, 4, 2, "#8a5a2a"); // 剑柄
}

/* ================= 今日日常（jx3api /active/calendar） ================= */
let dailyData = null, dailyErr = null, dailyLoading = false, dailySel = 0;
(function loadDailyCache() {
  try {
    const c = JSON.parse(localStorage.getItem("jx3daily") || "null");
    if (c && c.d && c.day === new Date().toDateString()) dailyData = c.d;   // 只用当天的缓存
  } catch (e) {}
})();
// 字段中文映射（jx3api 日历接口）
const DAILY_FIELDS = [
  ["war",       "大战"],
  ["battle",    "阵营战场"],
  ["school",    "门派事件"],
  ["rescue",    "救援"],
  ["orecar",    "矿车"],
  ["leader",    "世界首领", "arr"],
  ["card",      "秘境日常", "arr"],
  ["draw",      "挂件任务", "arr"],
  ["lucky",     "幸运宠",   "arr"],
  ["weekly.conn", "周常任务", "arr"],
  ["weekly.raid", "团本周本", "arr"],
];
function pick(obj, path) { return path.split(".").reduce((o, k) => o && o[k], obj); }
// 这些日常条目可以按 A 进副本打
const DUNGEON_KEYS = { war: true, battle: true, card: true, "weekly.raid": true };
function buildDailyRows() {
  if (!dailyData || typeof dailyData !== "object") return null;
  const rows = [];
  const head = dailyData.date ? (dailyData.date + (dailyData.week ? " · 周" + dailyData.week : "")) : null;
  if (head) rows.push({ t: head, key: null, label: null });
  for (const [key, label] of DAILY_FIELDS) {
    let v = pick(dailyData, key);
    if (v == null) continue;
    if (Array.isArray(v)) {
      if (!v.length) continue;
      v = v.join("、");
    }
    v = String(v).trim();
    if (!v) continue;
    rows.push({ t: label + "：" + v, key, label });
  }
  return rows.length ? rows : null;
}
async function fetchDaily() {
  dailyLoading = true; dailyErr = null;
  const url = "https://www.jx3api.com/active/calendar?mode=day";
  let d = null, netFail = false;
  // 直连 → r.jina.ai（CORS 开放）→ allorigins，逐级回退（jx3api 不开 CORS 头，浏览器直连会被拦）
  try {
    const r = await fetch(url, { signal: AbortSignal.timeout ? AbortSignal.timeout(8000) : undefined });
    const j = await r.json();
    if (j && (j.code === 200 || j.status === 200) && (j.detail || j.data)) d = j.detail || j.data;
  } catch (e) { netFail = true; }
  if (!d) {
    try {
      const r = await fetch("https://r.jina.ai/" + encodeURIComponent(url), { signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined });
      const t = await r.text();
      const i = t.indexOf('{"status"');
      if (i >= 0) {
        const j = JSON.parse(t.slice(i));
        if (j && j.detail) d = j.detail;
      }
    } catch (e) {}
  }
  if (!d) {
    try {
      const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url), { signal: AbortSignal.timeout ? AbortSignal.timeout(15000) : undefined });
      const j = await r.json();
      if (j && (j.code === 200 || j.status === 200) && (j.detail || j.data)) d = j.detail || j.data;
    } catch (e) {}
  }
  if (d) {
    dailyData = d;
    localStorage.setItem("jx3daily", JSON.stringify({ t: Date.now(), day: new Date().toDateString(), d }));
    dailyErr = null;
  } else {
    dailyErr = netFail ? "跨域/代理均失败" : "接口返回异常";
  }
  dailyLoading = false;
}
function renderDaily() {
  px(0, 0, W, H, "#141824");
  textC("— 今日日常 · " + DAILY_SERVER + " —", 80, 8, "#d8c68a", 10);
  if (dailyLoading) {
    textC("拉取中…", 80, 50, "#8a92ad", 10);
  } else {
    const rows = buildDailyRows();
    if (rows) {
      if (dailySel >= rows.length) dailySel = rows.length - 1;
      if (dailySel < 0) dailySel = 0;
      const visible = 6;
      let start = Math.max(0, Math.min(dailySel - Math.floor(visible / 2), rows.length - visible));
      rows.slice(start, start + visible).forEach((row, i) => {
        const idx = start + i;
        const y = 24 + i * 13;
        const cur = idx === dailySel;
        if (cur) px(4, y - 2, W - 8, 12, "#26314a");
        text(cur ? "▶" : " ", 5, y, cur ? "#f5e9b8" : "#cfd4e8", 9);
        if (row.key && DUNGEON_KEYS[row.key]) text("本", 148, y + 1, "#e8a04a", 8);  // 可打本标记
        const l = row.t;
        text(l.length > 15 ? l.slice(0, 14) + "…" : l, 14, y, cur ? "#f5e9b8" : "#cfd4e8", 9);
      });
      if (rows.length > visible) {
        textC((dailySel + 1) + "/" + rows.length, 80, 106, "#8a8fa5", 8);
        if (start > 0) text("▲", 8, 21, "#8a8fa5", 9);
        if (start + visible < rows.length) text("▼", 147, 88, "#8a8fa5", 9);
      }
    } else if (dailyErr) {
      textC(dailyErr, 80, 44, "#e8a08a", 9);
      textC("需能访问 jx3api.com", 80, 58, "#8a92ad", 8);
    } else {
      textC("暂无数据 · A 刷新", 80, 50, "#8a92ad", 9);
    }
    if (dailyErr && rows) textC("(显示缓存 · " + dailyErr + ")", 80, 116, "#8a8fa5", 8);
  }
  textC("A 进本/刷新 · B 返回", 80, 118, "#8a92ad", 8);
}

  const w = 12 + lv * 5, h = 7 + lv * 3;
  px(x0 + 1, y0 - h, w, h, lv >= 3 ? "#8a6a44" : "#6a5a3a");       // 墙
  for (let i = 0; i < 3; i++)                                       // 屋顶
    px(x0 - 2 + i, y0 - h - 3 + i, w + 4 - i * 2, 1, lv >= 4 ? "#d8c68a" : (lv >= 2 ? "#a04030" : "#4a3a26"));
  px(x0 + Math.floor(w / 2) - 1, y0 - 5, 3, 5, "#2e2519");          // 门
  if (lv >= 3) { px(x0 + w - 3, y0 - h - 7, 1, 4, "#5a4a32"); px(x0 + w - 2, y0 - h - 7, 4, 2, "#e8c860"); } // 金旗
}

function renderFeed() {
  renderMain();
  px(30, 30, 100, 68, "#1a1e2c");
  px(30, 30, 100, 1, "#d8c68a"); px(30, 97, 100, 1, "#d8c68a");
  textC("· 伙房 ·", 80, 34, "#d8c68a", 9);
  FEEDS.forEach((f, i) => {
    const y = 46 + i * 14;
    const on = i === feedIdx % FEEDS.length;
    if (on) px(36, y - 2, 88, 12, "#3a3f54");
    text(f.name + "  体力+" + f.gain + (cooling("feed_" + f.id) ? "（烹饪中）" : ""), 42, y, on ? "#f5e9b8" : "#8a92ad", 9);
  });
  textC("▲▼ 选择 · A 吃！ · B 返回", 80, 88, "#8a92ad", 8);
}

function renderHome() {
  px(0, 0, W, H, "#141824");
  const lv = S.homeLv, cost = (lv + 1) * 50;
  textC("— 家园 · " + HOME_NAMES[lv] + " —", 80, 8, "#d8c68a", 10);
  drawHouse(58, 116);
  const lines = [
    "等级：" + lv + "（" + HOME_NAMES[lv] + "）",
    "效果：心情流失 -" + (lv * 15) + "%",
    (lv >= 4 ? "已达最高等级" : "升级花费：" + cost + " 金币"),
    "现有金币：" + S.coins,
  ];
  lines.forEach((l, i) => text(l, 30, 34 + i * 13, "#cfd4e8", 9));
  textC(lv >= 4 ? "B 返回" : "A 升级 · B 返回", 80, 92, "#8a92ad", 8);
}

function renderStatus() {
  px(0, 0, W, H, "#141824");
  textC("— 侠士手札 —", 80, 8, "#d8c68a", 10);
  const C = SECTS[S.sect];
  const days = ((Date.now() - S.bornTs) / 1000 * speedF / 3600 / 24).toFixed(1);
  const t = titleOf(S.exp);
  const nt = nextTitle(S.exp);
  const prog = nt ? Math.round((S.exp - t.exp) / (nt.exp - t.exp) * 100) : 100;
  const lines = [
    "门派：" + C.name,
    "称号：" + t.t,
    "体力：" + Math.round(S.hunger) + " / 100",
    "心情：" + Math.round(S.mood) + " / 100",
    "修为：" + S.exp + "（晋升 " + prog + "%）",
    "金币：" + S.coins,
    "家园：" + HOME_NAMES[S.homeLv] + "（" + S.homeLv + "级）",
    "状态：" + (S.down ? "重伤卧床" : S.poisoned ? "中毒" : "康健"),
    "狼藉：" + S.mess + " 处",
    "江湖岁月：" + days + " 日",
  ];
  lines.forEach((l, i) => text(l, 22, 20 + i * 9, i === 7 && (S.down || S.poisoned) ? "#e8a08a" : "#cfd4e8", 8));
  textC("B 返回", 80, 116, "#8a92ad", 8);
}

/* ================= 输入 ================= */
function moveSel(d) {
  // 按当前页面分发：伙房子菜单用 feedIdx，日常页滚动列表，主菜单用 menuIdx
  if (page === "feed") { feedIdx = (feedIdx + d + FEEDS.length * 10) % FEEDS.length; beep(600, .03, "square", .06); return; }
  if (page === "daily") {
    const rows = buildDailyRows();
    if (!rows) return;
    dailySel = Math.max(0, Math.min(rows.length - 1, dailySel + d));
    beep(600, .03, "square", .06); return;
  }
  if (page !== "main") return;
  menuIdx = (menuIdx + d + MENU.length * 10) % MENU.length; beep(600, .03, "square", .06);
}
/* ---- 菜单自动收起（已弃用：多画面布局下图标常驻）---- */
let menuHideAt = 0;
function pokeMenu() { menuHideAt = Date.now() + 4500; }
function menuOpen() { return true; }

function confirmA() {
  if (page === "sect") {
    const keys = Object.keys(SECTS);
    S.sect = keys[menuIdx % keys.length];
    S._lastTitle = titleOf(S.exp).t;
    page = "main";
    toastMsg("拜入" + SECTS[S.sect].name + "！江湖路远，多多关照", sfx.up);
    save();
  } else if (page === "main") {
    const id = MENU[menuIdx % MENU.length].id;
    if (id === "feed") { page = "feed"; feedIdx = 0; sfx.ok(); }
    else doAct(id);
  } else if (page === "feed") {
    doAct("feed", feedIdx % FEEDS.length);
  } else if (page === "home") {
    const cost = (S.homeLv + 1) * 50;
    if (S.homeLv >= 4) { toastMsg("家园已至「山庄」，此乃极致", sfx.err); return; }
    if (S.coins < cost) { toastMsg("金币不足，还差 " + (cost - S.coins) + " 金", sfx.err); return; }
    S.coins -= cost; S.homeLv++;
    toastMsg("家园升为「" + HOME_NAMES[S.homeLv] + "」！心情更稳了", sfx.up);
    for (let i = 0; i < 12; i++) sparkles.push({ x: 30 + Math.random() * 100, y: 25 + Math.random() * 60, life: 30 + Math.random() * 20 });
    save();
  } else if (page === "status") {
    page = "main"; sfx.ok();
  } else if (page === "daily") {
    const rows = buildDailyRows();
    const row = rows && rows[dailySel];
    if (row && row.key && DUNGEON_KEYS[row.key]) {
      const name = row.t.split("：")[1] || row.label;
      page = "main";
      startDungeon(name);
    } else {
      fetchDaily();
      toastMsg("已刷新今日日常", sfx.ok);
    }
  }
}
function pressB() {
  if (page === "feed" || page === "status" || page === "home" || page === "daily") { page = "main"; beep(440, .05); }
  else if (page === "main") { page = "status"; sfx.ok(); }   // B 在主页 = 快捷看状态
}

/* ---- 4 实体键：▲▼ 选单 / A 确认 / B 返回 ---- */
document.getElementById("btnUp").onclick = () => moveSel(-1);
document.getElementById("btnDown").onclick = () => moveSel(1);
document.getElementById("btnA").onclick = confirmA;
document.getElementById("btnB").onclick = pressB;
// 真实尺寸切换（1 canvas 像素 = 1 CSS 像素，即真机 1.8 寸屏的显示密度）
const sizeToggle = document.getElementById("sizeToggle");
function applyRealSize(on) {
  document.body.classList.toggle("real-size", on);
  sizeToggle.classList.toggle("on", on);
  sizeToggle.textContent = on ? "切换：自适应屏幕" : "切换：真实尺寸 160×128";
  try { localStorage.setItem("jx3realsize", on ? "1" : "0"); } catch (e) {}
}
sizeToggle.addEventListener("click", () => applyRealSize(!document.body.classList.contains("real-size")));
try { applyRealSize(localStorage.getItem("jx3realsize") === "1"); } catch (e) {}
const deviceEl = document.querySelector(".device");
// 滚轮在整个机身上都可用（选单旋转）
deviceEl.addEventListener("wheel", e => { e.preventDefault(); moveSel(e.deltaY > 0 ? 1 : -1); }, { passive: false });
// 屏幕上左右滑也能旋转（手机友好）
let swipeX = null;
cv.addEventListener("pointerdown", e => { swipeX = e.clientX; });
cv.addEventListener("pointermove", e => {
  if (swipeX === null) return;
  if (Math.abs(e.clientX - swipeX) > 24) { moveSel(e.clientX < swipeX ? 1 : -1); swipeX = e.clientX; }
});
cv.addEventListener("pointerup", () => { swipeX = null; });
cv.addEventListener("pointercancel", () => { swipeX = null; });
window.addEventListener("keydown", e => {
  const now = Date.now();
  if (now < selectLock) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { moveSel(-1); selectLock = now + 90; }
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") { moveSel(1); selectLock = now + 90; }
  else if (e.key === "Enter") confirmA();
  else if (e.key === "Escape" || e.key === "b") pressB();
  e.preventDefault();
});

/* ================= 面板控件 ================= */
document.getElementById("speed").onchange = e => speedF = +e.target.value;
document.getElementById("mute").onchange = e => muted = e.target.checked;
document.getElementById("reset").onclick = () => {
  if (confirm("确定清档重开？侠士的江湖岁月将归零。")) {
    localStorage.removeItem("jx3tama");
    S = newState(); page = "sect"; menuIdx = 0;
  }
};

/* ================= 主循环 ================= */
if (!load()) { S = newState(); page = "sect"; }
else { page = "main"; S._lastTitle = titleOf(S.exp).t; }
speedF = +document.getElementById("speed").value;

let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (page !== "sect") applyTime(dt, speedF, false);
  save();
}, 1000);

(function loop() { render(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
