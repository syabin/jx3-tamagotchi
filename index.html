<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>剑网三拓麻歌子 · 网页原型</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", sans-serif;
    background: #f2ede3;
    background-image: radial-gradient(#e5ddcc 1px, transparent 1px);
    background-size: 24px 24px;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; gap: 24px; flex-wrap: wrap;
  }
  /* ---------- 蛋形机身（参照初代拓麻歌子 / TamaLIB，按键外置在机身下方） ---------- */
  .device {
    background: linear-gradient(165deg, #faf7f0 0%, #efe9dc 55%, #ddd5c4 100%);
    border-radius: 50% 50% 50% 50% / 56% 56% 44% 44%;
    padding: 26px 18px 20px;
    box-shadow: 0 18px 40px rgba(30,30,40,.35), inset 0 3px 6px rgba(255,255,255,.85), inset 0 -8px 14px rgba(120,110,90,.22);
    border: 3px solid #c9c2b2;
    width: 400px;
    max-width: calc(100vw - 16px);
    display: flex; flex-direction: column; align-items: center;
  }
  .device-title {
    text-align: center; color: #9a7a30; font-size: 12px; letter-spacing: 3px;
    margin-top: 10px; font-weight: bold;
  }
  .screen-frame {
    background: linear-gradient(160deg, #4a4132, #2e2820);
    border-radius: 16px;
    padding: 9px;
    border: 3px solid #c9a94a;
    box-shadow: inset 0 0 14px rgba(0,0,0,.8), 0 2px 4px rgba(0,0,0,.3);
    width: 100%;
  }
  canvas#screen {
    display: block; width: 100%; height: auto; aspect-ratio: 1 / 1;
    image-rendering: pixelated;
    border-radius: 6px;
    background: #10131c;
    cursor: pointer;
    touch-action: none;              /* 屏幕横滑选单时不要触发页面滚动 */
  }
  /* ---------- 真机预览：明亮配色 + 30fps 节拍 ----------
     v8.6：真机预览不再改机身配色——金框、粉键保持默认明亮风格；
     v8.5 已撤销 v8.4 的暖屏色域映射（QLUT 逐通道压暗/压黄、背光降 78%），屏幕仅做轻微提亮。 */
  body.qmode canvas#screen {
    filter: saturate(1.12) brightness(1.10);
  }
  /* ---------- 机身下方按键排（4 键：▲▼ 选单 / A 确认 / B 返回） ---------- */
  .ctl-row {
    display: flex; gap: 16px; justify-content: center; align-items: center;
    margin-top: 16px;
  }
  .ctl {
    width: 54px; height: 44px; border-radius: 14px;
    background: radial-gradient(circle at 35% 30%, #e8b4c8, #b86888 65%, #8a4a68);
    border: 3px solid #5a3048; color: #4a2840;
    font-size: 18px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,.35), inset 0 2px 5px rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center;
    user-select: none; touch-action: manipulation;
    transition: transform .06s;
  }
  .ctl.act { border-radius: 50%; width: 50px; height: 50px; font-size: 17px; }
  .ctl:active { transform: translateY(2px) scale(.94); }
  .ctl-cap {
    text-align: center; color: #9a8f78; font-size: 11px; margin-top: 8px;
  }
  /* ---------- 真实尺寸模式（1 canvas 像素 = 1 CSS 像素） ---------- */
  body.real-size .device { width: auto; }
  body.real-size canvas#screen { width: 128px; height: 128px; }
  .size-toggle {
    display: block; margin: 10px auto 0; padding: 4px 14px;
    background: #262a38; color: #8a92ad; border: 1px solid #3c4152; border-radius: 14px;
    font-size: 11px; cursor: pointer; user-select: none;
  }
  .size-toggle.on { color: #f5e9b8; border-color: #d8c68a; }
  /* ---------- 控制 ---------- */
  .controls { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; padding: 0 8px; }
  .dpad { display: flex; flex-direction: column; gap: 8px; }
  .btn.d { width: 56px; height: 42px; border-radius: 12px; font-size: 15px; }
  .btns { display: flex; gap: 14px; }
  .btn {
    width: 58px; height: 58px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #e8b4c8, #b86888 65%, #8a4a68);
    border: 3px solid #5a3048; color: #4a2840;
    font-size: 20px; font-weight: bold; cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,.45), inset 0 2px 5px rgba(255,255,255,.4);
    display: flex; align-items: center; justify-content: center;
    user-select: none; touch-action: manipulation;
    transition: transform .06s;
  }
  .btn:active { transform: translateY(2px) scale(.96); }
  .hint { color: #8a8fa5; font-size: 11px; text-align: center; margin-top: 10px; }
  /* ---------- 说明面板 ---------- */
  .panel {
    background: #fffdf6; border: 2px solid #d8cbb0; border-radius: 14px;
    width: 300px; max-width: calc(100vw - 16px);
    padding: 18px 20px; font-size: 13px; color: #4a4335;
    box-shadow: 0 8px 20px rgba(60,50,30,.15);
    line-height: 1.75;
  }
  .panel h2 { font-size: 16px; color: #6a5a2a; border-bottom: 2px solid #d8c68a; padding-bottom: 6px; margin-bottom: 10px; }
  .panel b { color: #8a5a1a; }
  .panel .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
  .panel select, .panel button {
    padding: 4px 10px; border-radius: 8px; border: 1px solid #c8b890;
    background: #f5eeda; cursor: pointer; font-size: 12px;
  }
  .panel button:hover { background: #eadfb8; }
  kbd { background: #2b2f3a; color: #d8c68a; border-radius: 4px; padding: 1px 6px; font-size: 11px; font-family: monospace; }
</style>
</head>
<body>

<div class="device">
  <div class="screen-frame">
    <canvas id="screen" width="128" height="128"></canvas>
  </div>
  <div class="device-title">剑网三 · 拓麻歌子</div>
</div>
<div class="ctl-row">
  <div class="ctl" id="btnUp">▲</div>
  <div class="ctl" id="btnDown">▼</div>
  <div class="ctl act" id="btnA">A</div>
  <div class="ctl act" id="btnB">B</div>
</div>
<button class="size-toggle" id="sizeToggle">切换：真实尺寸 128×128</button>

<div class="panel">
  <h2>江湖生存指南</h2>
  <div>你的侠士需要<b>体力</b>与<b>心情</b>维持，<b>打木桩</b>涨修为但耗体力，<b>打坐</b>回心情。</div>
  <div>⚠️ <b>狼牙袭击</b>会丢下狼藉（心情翻倍下滑），<b>中毒</b>不治会转为<b>重伤</b>。注意：<b>中毒/重伤不再封锁行动</b>，只是收益分别打 8 折 / 6 折，仍然能干活攒钱买玉露丸。</div>
  <div>🛒 吃东西要花金币：进<b>商城</b>买食材药品入行囊，再从<b>背包</b>使用——正版拓麻歌子的层级界面。</div>
  <div>✨ 偶尔触发<b>奇遇</b>，白捡修为。修为攒够就晋见称号。</div>
  <div>🕹️ 键盘 <b>←→</b>/<b>回车</b>/<b>Esc</b> 同效，滚轮和屏幕滑动也能选；<b>长按 B 1.5 秒</b>随时开系统设置。</div>
  <div class="row">
    时间流速
    <select id="speed">
      <option value="1" selected>真实 ×1（默认）</option>
      <option value="60">体验 ×60</option>
      <option value="10">真机档 ×10（约 1 小时饿空）</option>
      <option value="600">快进 ×600</option>
    </select>
  </div>
  <div class="row">
    <label><input type="checkbox" id="mute"> 静音</label>
    <label><input type="checkbox" id="qmode"> 真机预览（30fps · 明亮）</label>
  </div>
  <div class="row">
    <button id="reset">重新开号（清档）</button>
  </div>
  <div style="margin-top:8px; color:#9a8f78; font-size:11px;">存档自动保存在浏览器 localStorage，关页面不丢。</div>
</div>

<script>
"use strict";
/* ================= 基础 ================= */
const W = 128, H = 128;
const cv = document.getElementById("screen");
const ctx = cv.getContext("2d");
ctx.imageSmoothingEnabled = false;

const SECTS = {
  cy: { name: "纯阳", robe: "#4a8db8", trim: "#e8eef5", accent: "#bfe3ff", dark: "#3a6f94" },
  tc: { name: "天策", robe: "#a53a3a", trim: "#e8c860", accent: "#ffb0a0", dark: "#7e2b2b" },
  qx: { name: "七秀", robe: "#d16a9a", trim: "#f5e5f2", accent: "#ffc0e0", dark: "#a94f7c" },
  sl: { name: "少林", robe: "#a08040", trim: "#e8d8b0", accent: "#e8c890", dark: "#7e6630" },
};
const TITLES = [
  { exp: 0,   t: "初入江湖" },
  { exp: 50,  t: "小有名气" },
  { exp: 150, t: "名动一方" },
  { exp: 350, t: "威震八方" },
  { exp: 700, t: "天下无双" },
];
/* ================= 物品目录 =================
   type: food 食物 / med 药 / use 参悟 / mat 素材 / coll 收藏
   price = 商城售价（无则不卖）· sell = 卖价（无则不能卖）· cd = 食用冷却（秒）· anim = 使用演出时长（毫秒）
   经济锚点：大战固定掉落 250 金 */
const GOODS = {
  baozi:  { id:"baozi",  name:"包子",     type:"food", gain:15, mood:5, cd:12, price:80,  anim:2400, desc:"刚出笼的白面馒头，管饱。" },
  fish:   { id:"fish",   name:"蒸鱼",     type:"food", gain:30, mood:5, cd:25, price:150, anim:2800, desc:"江上现捞，姜丝去腥。" },
  feast:  { id:"feast",  name:"烧尾宴",   type:"food", gain:50, mood:5, cd:60, price:300, anim:3200, desc:"长安大酒楼的头牌席面。" },
  pill:   { id:"pill",   name:"玉露丸",   type:"med",  price:200, anim:2600, desc:"九花玉露，解毒疗伤。" },
  page:   { id:"page",   name:"剑意残页", type:"use",  exp:3, anim:2200, desc:"残页上剑意未尽，可参悟。" },
  iron:   { id:"iron",   name:"铁矿石",   type:"mat",  sell:60,  desc:"寻常矿石，铁匠收。" },
  tassel: { id:"tassel", name:"剑穗",     type:"coll", sell:150, desc:"旧剑上的穗子，有人好这口。" },
  steel:  { id:"steel",  name:"精铁",     type:"mat",  sell:200, desc:"锻造良材，重而沉手。" },
  shard:  { id:"shard",  name:"神兵残片", type:"coll", sell:500, desc:"紫品残片，藏家千金求。" },
  /* ---- 装备（v7.6：用「穿戴装备定义流派」代替拓麻歌子的进化分支——侠士不会变身，但装备决定强项）
          v7.7：装备分三品级（凡品/良品/珍品，tier 1/2/3），商城有售；
                签到「鸿运当头」送的装备与商城同池（按品级加权随机），非专属 ---- */
  w_sword:{ id:"w_sword",name:"精铁剑",   type:"equip", slot:"weapon", tier:1, price:300, eff:"武器 · 木桩修为+50%", desc:"百炼成钢，练武事半功倍。" },
  w_pick: { id:"w_pick", name:"镔铁镐",   type:"equip", slot:"weapon", tier:1, price:260, eff:"武器 · 挖宝金币+50%", desc:"掘地如泥，寻宝事半功倍。" },
  a_robe: { id:"a_robe", name:"云锦道袍", type:"equip", slot:"body",   tier:2, price:280, eff:"护身 · 心情流失-20%", desc:"绣云御寒，心平气和。" },
  a_charm:{ id:"a_charm",name:"平安符",   type:"equip", slot:"body",   tier:2, price:200, eff:"护身 · 副本胜率+15%", desc:"出入平安，逢凶化吉。" },
  t_jade: { id:"t_jade", name:"翡翠扳指", type:"equip", slot:"trea",   tier:2, price:350, eff:"饰品 · 赌坊赢利+20%", desc:"运筹帷幄，手气更旺。" },
  t_gourd:{ id:"t_gourd",name:"酒葫芦",   type:"equip", slot:"trea",   tier:1, price:150, eff:"饰品 · 打坐修为+2", desc:"酒后吐真言，参悟更透。" },
  /* ---- 玄晶（v7.7：团本 0.1% 掉落的橙色品级至宝，不同赛季不同玄晶，换赛季改这里） ---- */
  xj_zt:  { id:"xj_zt",  name:"铸天玄晶", type:"xj", sell:2500, desc:"本赛季团本至宝，橙光灼灼，藏家梦寐。" },
  /* ---- 庭院装饰（v7.6：购入即布置在家园庭院，提供常驻减免，画在庭院场景里） ---- */
  d_plant:{ id:"d_plant",name:"幽兰盆栽", type:"deco",  price:120, eff:"装饰 · 心情流失-5%", desc:"清心雅趣，暗香浮动。" },
  d_screen:{id:"d_screen",name:"云纹屏风",type:"deco",  price:260, eff:"装饰 · 心情流失-8%", desc:"遮风挡煞，庭院生辉。" },
  d_lamp: { id:"d_lamp", name:"长明灯",   type:"deco",  price:200, eff:"装饰 · 心情-6% 体力-6%", desc:"彻夜长明，宅院安稳。" },
};
const BAG_ORDER  = ["baozi","fish","feast","pill","page","iron","tassel","steel","shard","xj_zt","w_sword","w_pick","a_robe","a_charm","t_jade","t_gourd","d_plant","d_screen","d_lamp"];   // 背包：全部物品
const SHOP_ORDER = ["baozi","fish","feast","pill","w_sword","w_pick","a_robe","a_charm","t_jade","t_gourd","d_plant","d_screen","d_lamp"];                                          // 商城：可购买
/* 装备槽位与装饰效果表 */
const EQUIP_SLOTS = ["weapon", "body", "trea"];
const SLOT_NAMES  = { weapon: "武器", body: "护身", trea: "饰品" };
/* 装备品级（v7.7）：1 凡品 · 2 良品 · 3 珍品；签到「鸿运当头」按品级加权从商城同池随机 */
const EQ_TIERS = { 1: { name: "凡品", c: "#9aa3b8" }, 2: { name: "良品", c: "#7ec8f0" }, 3: { name: "珍品", c: "#c89af0" } };
/* 签到「鸿运当头」装备池：商城全部装备，品级权重（凡品×5 / 良品×2 / 珍品×1），以后加新装备自动入池 */
function giftEquipPool() {
  const pool = [];
  Object.values(GOODS).forEach(g => {
    if (g.type !== "equip" || !g.tier) return;
    const w = g.tier === 1 ? 5 : g.tier === 2 ? 2 : 1;
    for (let i = 0; i < w; i++) pool.push(g.id);
  });
  return pool;
}
const XJ_COLOR = "#ff9a3c";   // 玄晶：橙色品级
/* 商城/背包分类（v7.7） */
const CATS = [
  { id: "all",   label: "全部" },
  { id: "food",  label: "食品" },
  { id: "med",   label: "丹药" },
  { id: "equip", label: "装备" },
  { id: "deco",  label: "家具" },
  { id: "mat",   label: "材料" },
];
const catOf = g => g.type === "food" ? "food"
                 : (g.type === "med" || g.type === "use") ? "med"
                 : g.type === "equip" ? "equip"
                 : g.type === "deco" ? "deco"
                 : "mat";   // mat / coll / xj 都归材料
function filteredOrder(kind) {
  const cat = kind === "shop" ? shopCat : bagCat;
  const base = kind === "shop" ? SHOP_ORDER : BAG_ORDER;
  if (cat === "all") return base;
  return base.filter(gid => catOf(GOODS[gid]) === cat);
}
const DECO_LIST   = ["d_plant", "d_screen", "d_lamp"];
const DECO_MOOD   = { d_plant: 0.05, d_screen: 0.08, d_lamp: 0.06 };
const BETS = [50, 100, 200, 500, 1000];   // 赌坊押注档位
let gameSt = null;
const HOME_NAMES = ["荒地", "草庐", "木屋", "庭院", "山庄"];
const SPEEDS = { 60: 60, 600: 600, 1: 1, 10: 10 };
/* ================= 副本掉落表 =================
   固定掉落（金币/修为区间）+ 额外掉落（每件独立掷骰，可多件齐掉，也可以纯保底） */
const DUNGEONS = {
  war:    { name:"大战",     coin:[250,250], exp:[18,24], extra:[["iron",.40],["baozi",.30],["page",.10]] },
  battle: { name:"阵营战场", coin:[280,280], exp:[15,20], extra:[["gold100",.25],["pill",.08]] },
  card:   { name:"秘境日常", coin:[260,260], exp:[16,22], extra:[["fish",.20],["pill",.10],["tassel",.05]] },
  raid:   { name:"团本周本", coin:[400,450], exp:[25,33], extra:[["steel",.35],["pill",.15],["tassel",.12],["shard",.02]] },
};
const OFFLINE_MAX_GH = 4;   // 离线最多结算 4 游戏小时（回来不至于一进门就残血）
const LIST_ROWS = 4;        // 背包 / 商城列表每屏可见行数

/* ================= 状态 ================= */
let S = null;
let speedF = 1;                 // v8.2：默认真实 ×1（原 ×60）；面板下拉可改
let page = "sect";            // sect | main | bag | shop | item | home | daily | status | settings
let settingsFrom = "main";    // v8.0：进入设置前的页面，B 返回时回到原处（随时可开设置）
let menuIdx = 0;
let bagSel = 0;               // 背包列表选中索引
let shopSel = 0;              // 商城列表选中索引
let bagCat = "all", shopCat = "all";   // v7.7 分类过滤
let catMode = false;          // 分类标签行激活（列表页 ▲ 顶格进入，▲▼ 换分类，A 确认回列表）
let itemFrom = "bag";         // 详情页来源：bag | shop
let fx = null;                // 使用演出 {gid, kind, t0, dur}
let frame = 0;
let toast = null;             // {text, until} 非常驻提示（主界面下方长条）
let selHint = null;           // {text, until} 切换选中项时的短暂说明
let sparkles = [];
let selectLock = 0;           // 键盘重复节流
let qmode = false;            // 真机预览：30fps + 明亮配色（轻微提亮）
let lastFrameTs = 0;
let downGraceH = 0;           // 中毒累计游戏小时

function emptyBag() { const b = {}; BAG_ORDER.forEach(k => b[k] = 0); return b; }
function newState() {
  return {
    sect: null,
    hunger: 80, mood: 80, exp: 0, coins: 200, homeLv: 0,
    poisoned: false, down: false, mess: 0, dungeonUntil: 0, dungeonKey: null,
    bornTs: Date.now(), lastTs: Date.now(),
    cool: {}, poisonedH: 0, hungerH: 0, moodH: 0,
    bag: Object.assign(emptyBag(), { baozi: 2, pill: 1 }),   // 初始行囊：两个包子一瓶药
    equip: { weapon: null, body: null, trea: null },         // 装备槽位（v7.6，代替进化分支）
    decos: {},                                               // 庭院装饰（购入即布置）
    nannyGH: 0,                                              // 保姆代管剩余游戏时辰
    lastLogin: null, loginStreak: 0,                         // 每日登录奖励
  };
}
function save() { S.lastTs = Date.now(); localStorage.setItem("jx3tama", JSON.stringify(S)); }
function load() {
  try {
    const raw = localStorage.getItem("jx3tama");
    if (!raw) return false;
    const parsed = JSON.parse(raw);
    S = Object.assign(newState(), parsed);   // 旧档兼容：新字段自动补默认值
    if (!S.sect) return false;
    // 数值字段防 NaN 清洗
    ["hunger", "mood", "exp", "coins", "homeLv"].forEach(k => S[k] = +S[k] || 0);
    S.dungeonUntil = +S.dungeonUntil || 0;
    S.cool = S.cool || {};
    S.poisonedH = +S.poisonedH || 0;
    S.hungerH = +S.hungerH || 0; S.moodH = +S.moodH || 0;
    S.bag = Object.assign(emptyBag(), S.bag);   // 旧档补背包（含新物品）
    BAG_ORDER.forEach(k => S.bag[k] = Math.max(0, Math.floor(+S.bag[k] || 0)));
    // v7.6 新字段：装备 / 装饰 / 保姆 / 登录奖励（旧档自动补默认值）
    S.equip = Object.assign({ weapon: null, body: null, trea: null }, S.equip || {});
    EQUIP_SLOTS.forEach(s => { const g = S.equip[s] && GOODS[S.equip[s]]; if (!g || g.type !== "equip") S.equip[s] = null; });
    S.decos = S.decos || {};
    DECO_LIST.forEach(d => { S.decos[d] = !!S.decos[d]; });
    S.nannyGH = +S.nannyGH || 0;
    S.loginStreak = +S.loginStreak || 0;
    // 离线结算：上限 OFFLINE_MAX_GH 游戏小时（按 ×60 折算，与体验档一致）
    const awayReal = Math.max(0, Date.now() - (S.lastTs || Date.now())) / 1000;
    S._awayHours = Math.min(awayReal * 60 / 3600, OFFLINE_MAX_GH);
    if (S._awayHours > 0.05) applyTime(S._awayHours * 60, 60, true);   // 秒数 = 游戏小时 × 60
    return true;
  } catch (e) { return false; }
}
const titleOf = exp => { for (let i = TITLES.length - 1; i >= 0; i--) if (exp >= TITLES[i].exp) return TITLES[i]; return TITLES[0]; };
const nextTitle = exp => TITLES.find(t => t.exp > exp) || null;
const cooling = id => (S.cool[id] || 0) > Date.now();

/* ================= v7.6 新系统工具函数 =================
   ① 装备（代替拓麻歌子进化分支）：三槽位穿戴，被动改变各玩法收益
   ② 昼夜作息：游戏时间 22~6 时侠士自动就寝（消耗大减、行动受限）
   ③ 装饰：购入即布置庭院，提供常驻流失减免
   ④ 保姆代管：付费雇佣一段时间，消耗大减+自动洒扫+免疫随机恶事件 */
let wasSleep = false;                       // 上一次 tick 的就寝状态（用于入寝/醒来提示）
function hasEq(gid) { return EQUIP_SLOTS.some(s => S.equip && S.equip[s] === gid); }
function decoCount() { return DECO_LIST.reduce((n, d) => n + ((S.decos && S.decos[d]) ? 1 : 0), 0); }
function moodDecayCut() {                   // 装饰+装备的心情流失总减免（封顶 60%）
  let cut = hasEq("a_robe") ? 0.20 : 0;
  DECO_LIST.forEach(d => { if (S.decos && S.decos[d]) cut += DECO_MOOD[d]; });

}
function hungerDecayCut() { return (S.decos && S.decos.d_lamp) ? 0.06 : 0; }
function gameHour() { return (((Date.now() - S.bornTs) / 1000 * (speedF || 60) / 3600) + 8) % 24; }   // 游戏日从辰时(8点)起算：新档不会一出生就赶上下半夜就寝
function isSleeping() { const h = gameHour(); return h >= 22 || h < 6; }
/* 每日登录奖励：以现实自然日计，连续登录递增（断签重置），50 金起步、封顶 200，附赠包子；

  S.loginStreak = (S.lastLogin === yest) ? (S.loginStreak || 0) + 1 : 1;
  S.lastLogin = today;
  const reward = Math.min(200, 50 + (S.loginStreak - 1) * 25);

/* ================= 音效 ================= */

let AC = null;
function beep(freq, dur = 0.08, type = "square", vol = 0.15) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime + dur);
  } catch (e) {}
}
const sfx = {
  ok:    () => { beep(880, .06); beep(1320, .08); },
  err:   () => beep(160, .15, "sawtooth"),

/* ================= 时间推进 ================= */
function applyTime(dtSec, f, silent) {
  const gh = dtSec * f / 3600;               // 经过的游戏小时
  if (gh <= 0) return;
  const sleeping = isSleeping();             // 22~6 时就寝（离线结算时以归来时刻为准，近似处理）
  let hMul = 1, mMul = 1;
  if (S.nannyGH > 0) { hMul *= 0.2; mMul *= 0.2; }      // 保姆代管：消耗大减
  else if (sleeping) { hMul *= 0.35; mMul *= 0.2; }     // 就寝时段：消耗大减
  hMul *= 1 - hungerDecayCut();                         // 长明灯：体力流失减免
  mMul *= 1 - moodDecayCut();                           // 装饰/道袍：心情流失减免
  if (S.poisoned) hMul *= 2;
  if (S.mess > 0) mMul *= 2;
  // 重伤不再卧床（0.4 倍消耗等于变相省粮），改为收益打 6 折，见 actPenalty()
  mMul *= 1 - 0.15 * (S.homeLv || 0);        // 家园等级降低心情流失
  S.hunger = Math.max(0, S.hunger - 9 * gh * hMul);
  S.mood   = Math.max(0, S.mood  - 7 * gh * mMul);

  // 保姆代管：按游戏小时倒扣合约，期间自动洒扫
  if (S.nannyGH > 0) {
    S.nannyGH = Math.max(0, S.nannyGH - gh);
    if (S.mess > 0) S.mess = 0;
    if (S.nannyGH === 0 && !silent) toastMsg("保姆合约到期，侠士恢复自理", sfx.ok);
  }
  // 入寝 / 醒来提示
  if (!silent && wasSleep !== sleeping) {
    toastMsg(sleeping ? "夜深了（22时~6时），侠士就寝…" : "天亮了，侠士伸了个懒腰", sfx.ok);
  }
  wasSleep = sleeping;

  // 副本结算
  if (S.dungeonUntil > 0 && Date.now() >= S.dungeonUntil) {
    const key = S.dungeonKey;
    S.dungeonUntil = 0; S.dungeonKey = null;
    if (!silent) resolveDungeon(key);
  }

  // 随机事件：就寝与保姆代管期间全部免疫（睡得香、有人罩）
  if (!S.down && !S.poisoned && !silent && S.nannyGH <= 0 && !sleeping) {
    if (Math.random() < 0.5 * gh && S.mess < 3) { S.mess++; toastMsg("狼牙袭击！现场一片狼藉…", sfx.alert); }
    if (Math.random() < 0.12 * gh) { S.poisoned = true; S.poisonedH = 0; toastMsg("中毒了！收益 -20%，玉露丸可解", sfx.alert); }
    if (Math.random() < 0.10 * gh) {
      const gains = [8, 12, 20];
      const g = gains[Math.floor(Math.random() * gains.length)];
      S.exp += g;
      toastMsg("奇遇：拾得《剑意残页》，修为 +" + g, sfx.ok);
    }
  }
  if (S.poisoned && !S.down) {
    S.poisonedH += gh;
    if (S.poisonedH >= 3) {
      S.down = true; S.poisoned = false;
      toastMsg("毒气攻心，侠士重伤！收益 -40%，玉露丸可解", sfx.alert);
    }
  }
  checkDown("饿", gh);
  checkDown("郁", gh);
  /* 重伤自愈：没有玉露丸也不至于永久 -40%。
     只要把体力与心情都养到 60 以上并维持 2 游戏小时，伤势自然痊愈。 */
  if (S.down) {
    if (S.hunger >= 60 && S.mood >= 60) {
      S.recoverH = (S.recoverH || 0) + gh;
      if (S.recoverH >= 2) {
        S.down = false; S.recoverH = 0; S.poisonedH = 0;
        if (!silent) toastMsg("将养得当，侠士伤势痊愈！", sfx.up);
      }
    } else S.recoverH = 0;
  } else S.recoverH = 0;
  checkTitle();
}
/* 体力 / 心情见底累计 1 游戏小时后重伤（两者分别计数，互不干扰） */
function checkDown(kind, gh) {
  const key = kind === "饿" ? "hungerH" : "moodH";
  const low = kind === "饿" ? S.hunger : S.mood;
  if (low <= 0 && !S.down && !S.poisoned) {
    S[key] = (S[key] || 0) + gh;
    if (S[key] >= 1) {
      S.down = true; S[key] = 0;
      toastMsg("侠士" + (kind === "饿" ? "饿到" : "郁到") + "重伤！收益 -40%，先喂点吃的", sfx.alert);
    }
  } else if (low > 10) S[key] = 0;

/* ================= 副本结算 ================= */
function resolveDungeon(key) {
  const d = DUNGEONS[key] || DUNGEONS.war;
  const pen = actPenalty();                              // 中毒/重伤：收益与掉落率一起打折
  const win = Math.random() < Math.min(0.9, 0.4 + S.exp / 500 + S.hunger / 300 + (hasEq("a_charm") ? 0.15 : 0));   // 平安符：副本胜率+15%
  if (!win) {
    const ge = Math.max(1, Math.round(5 * pen));
    S.mood = Math.max(0, S.mood - 10); S.exp += ge;
    toastMsg("【" + d.name + "】团灭了…侠士灰头土脸（修为+" + ge + "）", sfx.err);
    return;
  }
  const rnd = ([a, b]) => a + Math.floor(Math.random() * (b - a + 1));
  const coin = Math.round(rnd(d.coin) * pen), exp = Math.max(1, Math.round(rnd(d.exp) * pen));
  S.coins += coin; S.exp += exp;
  const got = [];
  d.extra.forEach(([gid, pr]) => {
    if (Math.random() >= pr * pen) return;                // 每件独立掷骰，互不影响；异常状态掉率同样打折
    if (gid === "gold100") { const g = Math.round(100 * pen); S.coins += g; got.push("金币+" + g); return; }
    S.bag[gid] = (S.bag[gid] || 0) + 1;
    got.push(GOODS[gid] ? GOODS[gid].name : gid);
  });
  /* 玄晶（v7.7）：团本周本固定 0.1% 掉率（独立掷骰，不吃惩罚系数），橙色品级赛季至宝；
     不同赛季不同玄晶——换赛季只需改 GOODS 里的 xj 条目（当前：铸天玄晶） */
  const xj = Object.values(GOODS).find(g => g.type === "xj");
  let xjDrop = false;
  if (xj && key === "raid" && Math.random() < 0.001) {
    S.bag[xj.id] = (S.bag[xj.id] || 0) + 1;
    got.push(xj.name);
    xjDrop = true;
    for (let i = 0; i < 20; i++) sparkles.push({ x: 20 + Math.random() * 88, y: 25 + Math.random() * 70, life: 40 + Math.random() * 25 });
  }
  if (xjDrop) toastMsg("橙光乍现！！【" + xj.name + "】自穹顶坠落——天降鸿运！！", sfx.up);
  else toastMsg("【" + d.name + "】通关！金+" + coin + " 修为+" + exp + (got.length ? " · 另得 " + got.join("、") : "") + (pen < 1 ? " · " + penaltyText() : ""), sfx.up);
  checkTitle();
  save();
}
function checkTitle() {
  const t = titleOf(S.exp);
  if (S._lastTitle && S._lastTitle !== t.t) {
    toastMsg("晋见！称号晋升为「" + t.t + "」！", sfx.up);
    for (let i = 0; i < 14; i++) sparkles.push({ x: 60 + Math.random() * 40, y: 40 + Math.random() * 40, life: 30 + Math.random() * 20 });
  }

/* ================= 主界面（v0.2.0 重构） =================

const MENU = [

/* 异常状态不再封锁行动。
   原先中毒/重伤会禁止除吃药外的一切操作，而解毒只能靠玉露丸（商城 200 金）；

   属性恢复（吃饭回体力/打坐回心情）不打折，否则同样会陷入恢复不动的死循环。 */
function actPenalty() {

  if (S.dungeonUntil > Date.now()) return "副本进行中，侠士正在拼命！";

      break;
    }
    case "clean": {
      if (S.mess <= 0) { toastMsg("屋里挺干净的，无需打扫", sfx.err); return; }
      const p = actPenalty();
      S.mess = 0; S.mood = Math.min(100, S.mood + 5); S.exp += Math.max(1, Math.round(1 * p));
      toastMsg("打扫完毕，窗明几净（修为+1）", sfx.ok);

    case "dig": {
      if (cooling("dig")) { toastMsg("铁锹都挖冒烟了，歇会儿再挖", sfx.err); return; }
      if (S.hunger < 10) { toastMsg("饿得举不起锹，先吃点东西", sfx.err); return; }
      const p = actPenalty();
      S.hunger = Math.max(0, S.hunger - 6);
      S.cool.dig = now + 30000;
      const r = Math.random();
      const tail = p < 1 ? "（" + penaltyText() + "）" : "";
      const pickMul = hasEq("w_pick") ? 1.5 : 1;                    // 镔铁镐：挖宝金币+50%
      if (r < 0.55) { const g = Math.round((50 + Math.floor(Math.random() * 110)) * p * pickMul); S.coins += g; toastMsg("挖到 " + g + " 金币！" + (pickMul > 1 ? "（镔铁镐加成）" : "") + tail, sfx.ok); }
      else if (r < 0.80) { const ge = Math.max(1, Math.round(3 * p)); S.coins += Math.round(100 * p * pickMul); S.exp += ge; toastMsg("挖出一本《剑意残页》，修为 +" + ge + "！" + tail, sfx.up); }
      else if (r < 0.93) { toastMsg("挖了半天，只有一块石头…", sfx.err); }
      else if (S.mess < 3) { S.mess++; toastMsg("挖塌了土堆，弄得到处是泥…记得打扫", sfx.err); }
      else { toastMsg("挖到一块碎瓦，正好补屋顶", sfx.ok); }
      break;
    }
    case "bag":
      page = "bag"; bagSel = 0; catMode = true; sfx.ok(); return;    // v8.1：先进分类栏，选中分类再 A 进列表
    case "game":   // v0.2.0：游戏厅（左右选游戏，A 进入所选）
      page = "game";
      gameSt = { game: "hub", sel: 0 };
      sfx.ok(); return;
    case "shop":
      page = "shop"; shopSel = 0; catMode = true; sfx.ok(); return;    // v8.1：先进分类栏
    case "home":
      page = "home"; homeSel = 0; sfx.ok(); return;
    case "activity":
      page = "activity"; actSel = 0; sfx.ok();
      // 没数据就拉；有数据但本地缓存超过 1 小时也重新拉一次
      if (!dailyLoading && (!dailyData || Date.now() - dailyCacheTs > DAILY_REFRESH_MS)) fetchDaily();
      return;
    case "status":
      page = "status"; sfx.ok(); return;
  }
  page = "main";
}

function otaCheck() {

  const done = (j) => {
    otaState.ver = j && (j.version || j.ver);
    otaState.phase = (otaState.ver && otaState.ver !== APP_VERSION) ? "found" : "latest";
  };
  fetch("web端设计/version.json?ts=" + Date.now(), { cache: "no-store" })
    .then(r => (r.ok ? r.json() : Promise.reject(0)))
    .then(done)
    .catch(() => {
      fetch("index.html?ts=" + Date.now(), { cache: "no-store" })
        .then(r => r.text())
        .then(t => {
          const m = t.match(/APP_VERSION\s*=\s*"([\d.]+)"/);
          done({ version: m && m[1] });
        })
        .catch(() => { otaState.phase = "fail"; });
    });
}
function otaUpgrade() {

/* ================= 像素绘制 ================= */
function px(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); }
function text(str, x, y, c, size) {
  ctx.font = (size || 9) + "px 'Microsoft YaHei', sans-serif";
  ctx.fillStyle = c; ctx.textBaseline = "top";
  ctx.fillText(str, x, y);
}
function textC(str, cx, y, c, size) {
  ctx.font = (size || 9) + "px 'Microsoft YaHei', sans-serif";
  const w = ctx.measureText(str).width;
  ctx.fillStyle = c; ctx.textBaseline = "top";
  ctx.fillText(str, Math.round(cx - w / 2), y);
}
/* --- 走马灯：超宽文字自动横向滚动（像素屏风），不超宽则静止 --- */
function marquee(str, x, y, w, c, size, spd) {
  size = size || 9; spd = spd || 0.5;
  ctx.font = size + "px 'Microsoft YaHei', sans-serif";
  const tw = ctx.measureText(str).width;
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y - 1, w, size + 4); ctx.clip();
  ctx.fillStyle = c; ctx.textBaseline = "top";
  if (tw <= w) {
    ctx.fillText(str, x, y);
  } else {
    const gap = 14;                       // 首尾衔接空隙
    const total = tw + gap;
    const off = (Math.max(0, frame * spd - 26)) % total;   // 先停留约半秒再滚
    ctx.fillText(str, x - off, y);
    ctx.fillText(str, x - off + total, y);
  }
  ctx.restore();
}

/* --- 侠士小人（Q版像素角色，参照银发星星眼立绘重绘） ---
   大头 Q 版：银白长发+呆毛+蓝紫蝴蝶结(金扣)+深蓝星星眼+腮红+门派色衣装；
   所有姿态共用 head()，只换表情与身体动作。单位 u=2。 */
/* --- 侠士小人（Q版像素角色 v0.2.2 细化：2px 像素颗粒，同体型细节翻倍） ---
   头部为 20×17 逐像素位图（发丝/四芒星星眼/碎发/腮红全部按像素排布），
   身体 18×13 细化网格程序化绘制；所有姿态共用 head()/body()。
   单位 u：s=3 → u=2（主界面 1:1 像素），s=2 → u=1。 */
const PET_HEAD = [
  "....OOOOOOOOOOOO....",
  "..OOHHHHHHHHHHHHOO..",
  ".OHHLLHHHHHHHHLLHHO.",
  "OSHHLLHHHHHHHHLLHHSO",
  "OSSHHMHHHHHHHHMHHSSO",
  "OSSHHHHHHHHHHHHHHSSO",
  "OSSHHFFFFFFFFFFHHSSO",
  "OSSFFFHFFFFFFHFFFSSO",
  "OSSFFeeWeFFeeWeFFSSO",
  "OSSFFEWWEFFEWWEFFSSO",
  "OSSFFEeweFFEeweFFSSO",
  "OSSfBBFFFFFFFFBBfSSO",
  "OSSFFFFFFmmFFFFFFSSO",
  "OSSfFFFFFFFFFFFFfSSO",
  ".OOSSFFFFFFFFFFSSOO.",
  "....OOOOOOOOOOOO....",
  "......OOOOOOOO......",
];
const PET_PAL = {};
function drawPet(pose, pox = 52, poy = 32, s = 3) {
  const C = SECTS[S.sect] || SECTS.cy;
  const u = Math.max(1, Math.round(s * 2 / 3));
  const bob = pose === "idle" ? (Math.floor(frame / 30) % 2) : 0;
  const ox = pox, oy = poy + bob * u;
  const P = (x, y, w, h, c) => px(ox + x * u, oy + y * u, w * u, h * u, c);

  const OL = "#2b2b3a", HA = "#e6e7f2", HS = "#c2c5da", HL = "#ffffff", HM = "#d4d6ea";
  const SK = "#fce3d3", SK2 = "#eec9b4", BL = "#f2a3ad";
  const E1 = "#24378f", E2 = "#4366cf", WH = "#ffffff", E3 = "#9db8ff";
  const BOW = "#7b8ad4", BOW2 = "#6675bf", GOLD = "#e8c860";
  if (!PET_PAL.O) Object.assign(PET_PAL, { O: OL, H: HA, S: HS, L: HL, M: HM, F: SK, f: SK2, B: BL, E: E1, e: E2, W: WH, w: E3, m: "#c96b74" });

  /* 头部：位图逐像素渲染（同行同色合并成段，省 fillRect），mood 覆盖眼嘴区 */
  function head(hx, hy, mood) {
    const Q = (x, y, w, h, c) => P(hx + x, hy + y, w, h, c);
    PET_HEAD.forEach((row, y) => {
      let x0 = -1, ch0 = "";
      for (let x = 0; x <= 20; x++) {
        const ch = row[x] || "";
        if (ch !== ch0) {
          if (ch0 && ch0 !== "." && PET_PAL[ch0]) Q(x0, y, x - x0, 1, PET_PAL[ch0]);
          x0 = x; ch0 = ch;
        }
      }
    });
    // 呆毛（高光 + 尖端随风轻摆）
    Q(10, -2, 2, 2, HA); Q(10, -2, 1, 1, HL);
    if (Math.floor(frame / 40) % 2) Q(11, -3, 1, 1, HA); else Q(9, -3, 1, 1, HA);
    // 眼睛（位图默认星星眼：eeWe / EWWE / Eewe，其余表情覆盖重画）
    if (mood === "closed" || mood === "sleep") {
      Q(5, 8, 4, 3, SK); Q(11, 8, 4, 3, SK);
      Q(5, 8, 1, 1, OL); Q(6, 9, 2, 1, OL); Q(8, 8, 1, 1, OL);
      Q(11, 8, 1, 1, OL); Q(12, 9, 2, 1, OL); Q(14, 8, 1, 1, OL);
    } else if (mood === "happy") {
      Q(5, 8, 4, 3, SK); Q(11, 8, 4, 3, SK);
      Q(5, 9, 1, 1, OL); Q(6, 8, 2, 1, OL); Q(8, 9, 1, 1, OL);
      Q(11, 9, 1, 1, OL); Q(12, 8, 2, 1, OL); Q(14, 9, 1, 1, OL);
    } else if (mood === "hurt" || mood === "sick") {
      const et = mood === "sick" ? "#6a8a4a" : E2;
      Q(5, 8, 4, 3, SK); Q(11, 8, 4, 3, SK);
      Q(5, 9, 4, 2, E1); Q(5, 9, 4, 1, et);
      Q(11, 9, 4, 2, E1); Q(11, 9, 4, 1, et);
      Q(6, 10, 1, 1, WH); Q(12, 10, 1, 1, WH);
    }
    // 嘴（位图默认抿嘴，表情覆盖）
    if (mood === "happy") { Q(8, 12, 4, 1, "#8c3a48"); Q(9, 12, 2, 1, "#e88a94"); }
    else if (mood === "eat") {
      Q(9, 12, 2, 1, SK); Q(8, 12, 4, 1, "#8c3a48");
      if (Math.floor(frame / 8) % 2) Q(8, 13, 4, 1, "#8c3a48");
    }
    else if (mood === "hurt" || mood === "sick") { Q(9, 12, 2, 1, SK); Q(9, 12, 2, 1, "#8c3a48"); }
    // 蓝紫蝴蝶结 + 金扣 + 飘带（左耳侧，压发缘）
    Q(1, 6, 2, 1, BOW);
    Q(0, 7, 4, 1, BOW); Q(0, 8, 4, 1, BOW2);
    Q(1, 7, 1, 1, "#a3b0e8"); Q(1, 8, 2, 1, GOLD);
    Q(1, 9, 2, 1, BOW2); Q(0, 10, 1, 2, BOW2);
  }

  /* 身体：交领右衽 + 双线袖口广袖 + 腰带玉佩 + 腿靴（18×13 细化网格） */
  function body(by) {
    const DARK = C.dark || C.robe;
    P(4, by, 12, 1, C.trim);                                 // 肩线
    P(8, by + 1, 4, 1, C.trim);                              // 交领口
    P(7, by + 2, 1, 1, C.trim); P(12, by + 2, 1, 1, C.trim); // 斜襟
    P(9, by + 3, 2, 1, C.trim);                              // V 领尖
    P(4, by + 1, 12, 8, C.robe);                             // 衣身
    P(4, by + 1, 1, 8, DARK); P(15, by + 1, 1, 8, DARK);     // 衣身侧影
    P(9, by + 6, 2, 1, GOLD);                                // 衣扣
    P(2, by + 1, 2, 5, C.robe); P(16, by + 1, 2, 5, C.robe); // 广袖
    P(2, by + 1, 2, 1, C.trim); P(16, by + 1, 2, 1, C.trim); // 袖口沿
    P(2, by + 5, 2, 1, C.trim); P(16, by + 5, 2, 1, C.trim); // 袖口双线
    P(2, by + 6, 1, 1, SK); P(17, by + 6, 1, 1, SK);         // 手
    P(4, by + 9, 12, 1, C.trim);                             // 腰带
    P(9, by + 10, 2, 1, GOLD);                               // 带扣
    P(9, by + 11, 1, 2, C.accent);                           // 玉佩垂穗
    P(6, by + 10, 2, 2, "#3a3a52"); P(12, by + 10, 2, 2, "#3a3a52"); // 腿
    P(6, by + 12, 2, 1, "#23232f"); P(12, by + 12, 2, 1, "#23232f"); // 靴
  }

  if (pose === "sleep") {                       // 就寝：侧卧闭眼（贴地）
    head(1, 10, "sleep");
    P(3, 27, 14, 2, C.robe); P(2, 29, 16, 2, C.trim);
    return;
  }
  if (pose === "down") {                        // 重伤：佝偻痛苦
    head(1, 3, "hurt");
    P(4, 20, 12, 7, C.robe); P(5, 20, 10, 1, C.trim);
    P(4, 27, 12, 2, "#3a3a52"); P(4, 29, 12, 1, "#23232f");
    const a = frame / 12;
    px(ox + (11 + Math.cos(a) * 7) * u, oy + (1 + Math.sin(a) * 2) * u, 3, 3, "#f5e9b8");
    return;
  }
  if (pose === "sick") {                        // 中毒：蜷坐绿眼圈
    head(1, 5, "sick");
    P(4, 22, 12, 5, C.robe); P(5, 22, 10, 1, C.trim);
    P(3, 27, 14, 2, C.robe); P(4, 29, 12, 1, "#3a3a52");
    const a = frame / 10;
    for (let i = 0; i < 3; i++) {
      const bx = 10 + Math.cos(a + i * 2.1) * 7;
      const byy = 1 - Math.abs(Math.sin(a + i * 2.1)) * 4;
      px(ox + bx * u, oy + byy * u, 2, 2, "#b8d88a");
    }
    return;
  }
  if (pose === "sit") {                         // 打坐：闭眼 + 气环（盘坐贴地）
    head(0, 8, "closed");
    P(6, 23, 8, 2, C.robe); P(6, 23, 8, 1, C.trim);
    P(3, 25, 14, 3, C.robe);
    P(3, 25, 1, 3, C.trim); P(16, 25, 1, 3, C.trim);
    P(4, 28, 12, 2, "#3a3a52");
    const r = 3 + Math.sin(frame / 15) * 1.5;
    ctx.strokeStyle = C.accent; ctx.globalAlpha = .8;
    ctx.beginPath();
    ctx.ellipse(ox + 9 * u, oy + (7 - r) * u, r * u, r * u * .4, 0, 0, Math.PI * 2);
    ctx.stroke(); ctx.globalAlpha = 1;
    return;
  }
  if (pose === "eat") {                         // 吃饭：张嘴 + 饭碗
    head(0, 0, "eat"); body(17);
    const bo = Math.floor(frame / 8) % 2;
    P(19, 22, 6, 3, "#d8d8e0"); P(20, 25, 4, 1, "#d8d8e0");
    if (bo) { P(20, 19, 2, 2, "#e8d8a0"); P(22, 18, 1, 1, "#e8d8a0"); }
    return;
  }
  if (pose === "train") {                       // 打木桩：冲拳 + 木桩 + 汗滴
    const wx = ox + 22 * u, wy = oy + 5 * u;    // 木桩（顶 y≈38，桩身落到地面）
    px(wx, wy + u, 7 * u, 25 * u, "#7a5a34"); px(wx + u, wy, 6 * u, u, "#8a6a40");
    px(wx - u, wy + 4 * u, 9 * u, 2 * u, "#6a4a2a"); px(wx - u, wy + 14 * u, 9 * u, 2 * u, "#6a4a2a");
    const punch = Math.floor(frame / 10) % 2;
    head(0, 0, "star"); body(17);
    if (punch) { P(16, 19, 7, 2, SK); P(22, 19, 2, 2, C.trim); }
    else { P(16, 21, 5, 2, SK); }
    P(15, 18, 3, 2, "#8a5a2a"); P(16, 20, 1, 6, "#b8c0d0");   // 背剑
    if (punch) px(ox + 3 * u, oy + u, 2, 3, "#9ad0e8");       // 汗滴
    return;
  }
  if (pose === "dig") {                         // 挖宝：举锹/插地
    const sw = Math.floor(frame / 8) % 2;
    head(0, 2, "star"); body(19);
    if (sw) { P(15, 16, 2, 6, "#8a6a40"); P(14, 13, 4, 3, "#b8c0d0"); }
    else { P(15, 23, 2, 7, "#8a6a40"); P(14, 29, 4, 3, "#b8c0d0"); P(6, 30, 8, 2, "#5a4a30"); }
    return;
  }
  if (pose === "dungeon") {                     // 副本：挥剑 + 小怪
    const mx = ox + 21 * u + (Math.floor(frame / 14) % 2) * u, my = oy + 3 * u;
    px(mx, my + 3 * u, 11 * u, 7 * u, "#4a7a3a");
    px(mx + u, my, 9 * u, 3 * u, "#4a7a3a");
    px(mx + 2 * u, my + u, u, u, "#e8d840"); px(mx + 6 * u, my + u, u, u, "#e8d840");
    px(mx - u, my + u, u, 2 * u, "#2e4a24"); px(mx + 11 * u, my + u, u, 2 * u, "#2e4a24");
    const slash = Math.floor(frame / 6) % 2;
    head(0, 0, "happy"); body(17);
    if (slash) { P(16, 19, 7, 2, C.trim); px(ox + 20 * u, oy + 12 * u, 10, 3, "#e8f0ff"); }
    else { P(16, 21, 5, 2, SK); }

let dailyData = null, dailyErr = null, dailyLoading = false, dailySel = 0;
let actSel = 0;                               // 活动页选中行（上半行动 + 下半日常）
let dailyStale = false, dailyStaleCache = null;   // 离线兜底：上次成功拉取的旧缓存
let dailyCacheTs = 0;                             // 本地缓存时间戳，用于判断要不要重新拉
(function loadDailyCache() {
  try {
    const c = JSON.parse(localStorage.getItem("jx3daily") || "null");
    if (c && c.d) {
      if (c.day === new Date().toDateString()) { dailyData = c.d; dailyCacheTs = +c.t || 0; }   // 当天缓存直接可用
      else dailyStaleCache = c.d;                                                              // 旧日期缓存留作断网兜底
    }
  } catch (e) {}
})();
// 字段中文映射（jx3api 日历接口）
const DAILY_FIELDS = [
  ["war",       "大战"],
  ["battle",    "阵营战场"],
  ["school",    "门派事件"],
  ["rescue",    "救援"],
  ["orecar",    "矿车"],
  ["leader",    "世界首领", "arr"],
  ["card",      "秘境日常", "arr"],
  ["draw",      "挂件任务", "arr"],
  ["lucky",     "幸运宠",   "arr"],
  ["weekly.conn", "周常任务", "arr"],
  ["weekly.raid", "团本周本", "arr"],
];
function pick(obj, path) { return path.split(".").reduce((o, k) => o && o[k], obj); }
// 这些日常条目可以按 A 进副本打（键 → DUNGEONS 表的副本 key）
const DUNGEON_KEYS = { war: "war", battle: "battle", card: "card", "weekly.raid": "raid" };
function buildDailyRows() {
  if (!dailyData || typeof dailyData !== "object") return null;
  const rows = [];
  const head = dailyData.date ? (dailyData.date + (dailyData.week ? " · 周" + dailyData.week : "")) : null;
  if (head) rows.push({ t: head, key: null, label: null });
  for (const [key, label] of DAILY_FIELDS) {
    let v = pick(dailyData, key);
    if (v == null) continue;
    if (Array.isArray(v)) {
      if (!v.length) continue;
      v = v.join("、");
    }
    v = String(v).trim();
    if (!v) continue;
    rows.push({ t: label + "：" + v, key, label });
  }
  return rows.length ? rows : null;
}
/* 日常数据来源（v7.3 双通道，v0.1.87 目录重组后路径改为 web端设计/data/daily.json，按顺序尝试）：
   1) 同源 web端设计/data/daily.json —— GitHub Actions 每小时预取（见 .github/workflows/fetch-daily.yml），
      网页端（GitHub Pages / 本地静态服务）走这条：同源请求零跨域、零代理，走的客户端自己的网络；
   2) 直连 jx3api —— 主机端（ESP32 固件）没有浏览器跨域限制，json 不存在时自然落到这条。
   注意（别踩坑）：jx3api 不返回 Access-Control-Allow-Origin、不支持 JSONP，浏览器里直连通道
   基本必被同源策略拦——这是留给固件和有代理部署用的，网页端别指望它。
   公共 CORS 代理一律不用：r.jina.ai（海外）不稳定且用户明确不用，allorigins/codetabs 等 2026-11-26 实测全灭。 */
const DAILY_SOURCES = ["web端设计/data/daily.json", "https://www.jx3api.com/active/calendar?mode=day"];
const DAILY_REFRESH_MS = 3600e3;   // 本地缓存超过 1 小时就重新拉一次
async function fetchDaily() {
  dailyLoading = true; dailyErr = null;
  for (const src of DAILY_SOURCES) {
    try {
      const r = await fetch(src + (src.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const j = await r.json();
      const d = j.detail || j;   // 兼容两种形态：预取 json 有 fetchedAt/detail，jx3api 直连是 {status,detail}
      if (!d || !d.date) throw new Error("payload 异常");
      dailyData = d;
      dailyStale = false;
      dailyCacheTs = Date.now();
      localStorage.setItem("jx3daily", JSON.stringify({ t: Date.now(), day: new Date().toDateString(), d }));
      dailyLoading = false;
      return;
    } catch (e) { /* 本通道失败，试下一个 */ }
  }
  if (dailyStaleCache) { dailyData = dailyStaleCache; dailyStale = true; }   // 全部通道失败，用旧缓存顶着
  else { dailyErr = "日常数据未加载"; }
  dailyLoading = false;
}
/* ================= 活动页（v0.2.0：打坐/木桩/挖宝/家园 + 今日日常） =================
   ▲▼ 上下选，A 执行（行动）/ 进本（可打本的日常）/ 刷新，B 返回主页。 */

    { kind: "act", id: "train", cd: "train", t: "【木桩】勤练剑法 · 修为+12 耗体力" },
    { kind: "act", id: "dig",   cd: "dig",   t: "【挖宝】铁锹寻宝 · 金币入袋" },

  for (let i = 0; i < 10; i++) px(sx + 4 + i * 4, 64 + (i % 2), 2, 1, mtnN);  // 山脊抖动

/* --- 家园小屋（随等级变大变漂亮，可指定落点；night = 夜间点灯） --- */
function drawHouse(x0 = 8, y0 = 100, night) {
  const lv = S.homeLv || 0;
  if (lv === 0) return; // 荒地，无房
  const w = 12 + lv * 5, h = 7 + lv * 3;
  const wall = lv >= 3 ? "#8a6a44" : "#6a5a3a";
  const wallD = lv >= 3 ? "#6e5434" : "#544730";
  const roofC = lv >= 4 ? "#d8c68a" : (lv >= 2 ? "#a04030" : "#4a3a26");
  const roofD = lv >= 4 ? "#b8a468" : (lv >= 2 ? "#7e3026" : "#3a2e1e");
  // 墙（竖木纹 + 底基暗线）
  px(x0 + 1, y0 - h, w, h, wall);
  for (let i = 2; i < w - 1; i += 3) px(x0 + 1 + i, y0 - h + 1, 1, h - 2, wallD);
  px(x0 + 1, y0 - 1, w, 1, wallD);
  // 屋顶（叠瓦两层 + 飞檐 + 脊饰）
  for (let i = 0; i < 3; i++)
    px(x0 - 2 + i, y0 - h - 3 + i, w + 4 - i * 2, 1, roofC);
  px(x0 + 2, y0 - h - 1, w - 4, 1, roofD);
  px(x0 - 3, y0 - h - 4, w + 6, 1, roofC);          // 飞檐
  px(x0 + Math.floor(w / 2) - 2, y0 - h - 4, 2, 1, lv >= 4 ? "#f0e2a0" : "#e8c860");
  // 门 + 门环
  px(x0 + Math.floor(w / 2) - 1, y0 - 5, 3, 5, "#2e2519");
  px(x0 + Math.floor(w / 2) + 1, y0 - 3, 1, 1, "#c9b070");
  // 窗（夜间亮灯）
  if (w >= 14) {
    px(x0 + 2, y0 - h + 2, 3, 3, night ? "#f0d878" : "#3a3a52");
    px(x0 + 2, y0 - h + 2, 3, 1, "#5a4632");
  }
  if (lv >= 3) { px(x0 + w - 3, y0 - h - 7, 1, 4, "#5a4a32"); px(x0 + w - 2, y0 - h - 7, 4, 2, "#e8c860"); } // 金旗
  // 夜间檐下灯笼
  if (night && lv >= 2) {
    px(x0 + w - 1, y0 - h + 1, 1, 2, "#5a4a32");
    px(x0 + w, y0 - h + 3, 2, 3, "#d85a4a"); px(x0 + w, y0 - h + 4, 2, 1, "#f0a060");
  }
}

/* --- 选中框：像素金框 + 四角加粗 --- */
function selFrame(x, y, w, h) {
  const c = "#d8c68a";
  px(x, y, w, 1, c); px(x, y + h - 1, w, 1, c);
  px(x, y, 1, h, c); px(x + w - 1, y, 1, h, c);
  px(x, y, 3, 2, "#f5e9b8"); px(x + w - 3, y, 3, 2, "#f5e9b8");
  px(x, y + h - 2, 3, 2, "#f5e9b8"); px(x + w - 3, y + h - 2, 3, 2, "#f5e9b8");
}
/* 右对齐文字 */
function textR(str, rx, y, c, size) {
  ctx.font = (size || 9) + "px 'Microsoft YaHei', sans-serif";
  const w = ctx.measureText(str).width;
  ctx.fillStyle = c; ctx.textBaseline = "top";
  ctx.fillText(str, Math.round(rx - w), y);
}
/* 物品效果的短标签：一行最多 10 个汉字，别写成句子 */
function itemEffect(g) {
  if (g.type === "food") return "体力+" + g.gain + " · 心情+" + (g.mood || 0);
  if (g.type === "med")  return "解毒 / 救重伤";
  if (g.type === "use")  return "修为+" + g.exp;
  if (g.type === "equip") return g.eff;
  if (g.type === "deco")  return g.eff;
  if (g.type === "xj")    return "赛季至宝 · 可卖 " + g.sell + " 金";
  if (g.sell)            return "可卖 " + g.sell + " 金";
  return "";
}
/* 品级配色：装备按 tier，玄晶固定橙色 */
function itemColor(g) {
  if (g.type === "xj") return XJ_COLOR;
  if (g.type === "equip" && g.tier && EQ_TIERS[g.tier]) return EQ_TIERS[g.tier].c;
  return null;
}
function itemAction(g, from) {
  if (from === "shop") return "A 购买 · B 返回";
  if (g.type === "food") return "A 吃掉 · B 返回";
  if (g.type === "med")  return "A 服用 · B 返回";
  if (g.type === "use")  return "A 参悟 · B 返回";
  if (g.type === "equip") return hasEq(g.id) ? "A 卸下 · B 返回" : "A 装备 · B 返回";
  if (g.type === "deco")  return "庭院已布置 · B 返回";
  return g.sell ? "A 卖出 · B 返回" : "B 返回";
}

/* ================= 游戏厅（v0.2.0） =================
   进入先左右选游戏（◀▶ 或 ▲▼），A 进入所选，B 返回主页。
   现有：押大小（黑市赌坊）；新增：打地鼠 / 钓鱼 / 翻牌配对。
   每个小游戏独立冷却，防止无限刷金币。 */
const GAMES = [
  { id: "dice",   name: "押大小",  desc: "黑市赌坊 · 猜大小",    cd: 0 },
  { id: "whack",  name: "打地鼠",  desc: "眼疾手快 · 敲中赚钱",  cd: 60000 },
  { id: "fish",   name: "钓鱼",    desc: "看准时机 · 收竿",      cd: 45000 },
  { id: "memory", name: "翻牌配对", desc: "记住牌面 · 两两配对", cd: 90000 },
  { id: "race",   name: "赛马",    desc: "四驹争先 · 押中翻倍", cd: 45000 },
];
/* ---- 赛马：四驹争先 ----
   赔率越高 = 实力越弱 = 冷门。每匹马每帧步长带随机抖动，还会随机冲刺，
   所以冷门翻盘是常态，押热门稳但赚得少。 */
const HORSES = [
  { name: "赤兔", body: "#d0603e", dark: "#8a3a22", odds: 2, spd: 1.16 },
  { name: "的卢", body: "#e8e2d0", dark: "#9a9482", odds: 3, spd: 1.08 },
  { name: "乌骓", body: "#5a6382", dark: "#2a3048", odds: 5, spd: 1.00 },
  { name: "绝影", body: "#8a6ab8", dark: "#5a3f88", odds: 8, spd: 0.92 },
];
const RACE_BETS = [50, 100, 200, 500];
const RACE_LEN  = 96;          // 赛道长度（像素）

function gameStart(id) {
  const g = GAMES.find(x => x.id === id);
  if (g && g.cd && cooling("g_" + id)) { toastMsg(g.name + "还在冷却，歇口气再来", sfx.err); return; }
  if (id === "dice") {
    if (S.coins < 50) { toastMsg("赌坊最低押 50 金币，先去赚点本钱", sfx.err); return; }
    gameSt = { game: "dice", phase: "side", side: 1, betIdx: 1, dice: [1, 1, 1], t: 0, sum: 0, win: false, baozi: false, pay: 0 };
  } else if (id === "whack") {
    gameSt = { game: "whack", phase: "play", cur: 2, mole: -1, next: 18, t: 0, hits: 0, swings: 0, pay: 0, pop: "", popT: 0 };
  } else if (id === "fish") {
    gameSt = { game: "fish", phase: "run", pos: 0, dir: 1, cast: 3, zoneL: 6 + Math.floor(Math.random() * 9), zoneW: 5, gain: 0, good: 0, pop: "", popT: 0 };
  } else if (id === "memory") {
    gameSt = { game: "memory", phase: "play", cur: 0, faces: [0, 1, 2, 0, 1, 2].sort(() => Math.random() - 0.5),
               open: [], done: [false, false, false, false, false, false], first: -1, matched: 0, wait: 0, pay: 0 };
  } else if (id === "race") {
    if (S.coins < RACE_BETS[0]) { toastMsg("赛马最低押 " + RACE_BETS[0] + " 金，先去赚点盘缠", sfx.err); return; }
    gameSt = { game: "race", phase: "pick", sel: 0, betIdx: 0, winner: -1,
               hs: [0, 1, 2, 3].map(() => ({ pos: 0, burst: 0 })),
               t: 0, win: false, pay: 0, pop: "", popT: 0 };
  }
  sfx.ok();
}
function gameExit() { gameSt = { game: "hub", sel: 0 }; beep(440, .05); }   // 任意游戏 → 回游戏厅
function gameTick() {   // render 帧驱动
  const st = gameSt;
  if (!st) return;
  if (st.popT > 0) st.popT--;
  if (st.game === "dice") return gameRollTick();
  if (st.game === "whack" && st.phase === "play") {
    st.t++;
    if (st.mole < 0 || st.t > st.next) {                       // 地鼠冒头 / 换洞
      st.mole = Math.floor(Math.random() * 6);
      st.next = st.t + 26 + Math.floor(Math.random() * 30);
    }
  }
  if (st.game === "fish" && st.phase === "run") {              // 指针摆动
    st.pos += st.dir;
    if (st.pos >= 20) { st.pos = 20; st.dir = -1; }
    if (st.pos <= 0)  { st.pos = 0;  st.dir = 1; }
  }
  if (st.game === "memory" && st.phase === "play" && st.wait > 0) {
    if (--st.wait === 0) { st.open = []; st.first = -1; }      // 不匹配：1 秒后盖回
  }
  if (st.game === "race" && st.phase === "race") {
    st.t++;
    let fin = -1;
    for (let i = 0; i < 4; i++) {
      const h = st.hs[i];
      if (h.pos >= RACE_LEN) continue;
      if (h.burst > 0) h.burst--;
      else if (Math.random() < 0.035) h.burst = 9 + Math.floor(Math.random() * 12);   // 随机冲刺
      const boost = h.burst > 0 ? 1.85 : 1;
      h.pos += (HORSES[i].spd * 0.34 + Math.random() * 0.30) * boost;
      if (h.pos >= RACE_LEN) { h.pos = RACE_LEN; if (fin < 0) fin = i; }
    }
    if (fin >= 0) raceSettle(fin);        // 先到终点者夺冠，当帧结算
  }
}

/* ---- 赛马结算 ---- */
function raceSettle(w) {
  const st = gameSt;
  st.winner = w; st.phase = "result";
  const bet = RACE_BETS[st.betIdx];
  const pen = actPenalty();                                   // 中毒/重伤：赢来的钱也打折
  if (w === st.sel) {
    st.win = true;
    st.pay = Math.max(1, Math.round(bet * HORSES[w].odds * pen * (hasEq("t_jade") ? 1.2 : 1)));
    S.coins += st.pay; S.exp += 2; checkTitle(); sfx.up();
  } else {
    st.win = false; st.pay = bet;
    S.coins = Math.max(0, S.coins - bet); sfx.err();
  }
  S.cool["g_race"] = Date.now() + 45000;
  save();
}

function gameRollTick() {   // 摇骰动画与结算（render 帧驱动）
  const st = gameSt;
  if (st.phase !== "roll") return;
  st.t++;
  if (st.t % 4 === 0) st.dice = st.dice.map(() => 1 + Math.floor(Math.random() * 6));
  if (st.t > 60) {
    st.sum = st.dice[0] + st.dice[1] + st.dice[2];
    st.baozi = st.dice[0] === st.dice[1] && st.dice[1] === st.dice[2];
    st.win = !st.baozi && ((st.sum >= 11) === (st.side === 1));
    const bet = BETS[st.betIdx];
    const pen = actPenalty();                 // 中毒/重伤照样能赌，但赢来的钱也打折，避免绕开惩罚
    st.pay = Math.max(1, Math.round(bet * pen * (hasEq("t_jade") ? 1.2 : 1)));   // 翡翠扳指：赌坊赢利+20%
    if (st.win) { S.coins += st.pay; S.exp += Math.max(1, Math.round(2 * pen)); checkTitle(); }
    else {
      S.coins = Math.max(0, S.coins - bet);
      if (S.coins < 50) { st.phase = "result"; save(); toastMsg("输光了…赌坊老板把你请了出去", sfx.err); gameExit(); return; }
    }
    (st.win ? (st.baozi ? sfx.err : sfx.up) : sfx.err)();
    st.phase = "result";
    save();
  }
}

/* ---- 赛马：pick 选马 → bet 定注 → race 跑 → result 结算 ---- */
function drawHorse(x, y, h, moving) {
  px(x + 1, y + 2, 6, 3, h.body);            // 身
  px(x + 6, y, 3, 3, h.body);                // 头
  px(x + 8, y + 1, 1, 1, "#10131c");         // 眼
  px(x + 5, y, 2, 1, h.dark);                // 鬃
  px(x, y + 1, 1, 3, h.dark);                // 尾
  const ph = moving ? ((frame >> 2) & 1) : 0; // 四蹄交替
  px(x + 2, y + 5, 1, 1 + ph, h.dark);
  px(x + 5, y + 5, 1, 2 - ph, h.dark);
}
function renderRace() {
  const st = gameSt;
  px(0, 0, W, H, "#141824");
  textC("— 马 场 —", 64, 4, "#d8c68a", 10);
  text("金" + S.coins, 5, 4, "#e8c860", 8);

  /* 选马 */
  if (st.phase === "pick") {
    HORSES.forEach((h, i) => {
      const y = 26 + i * 21, on = i === st.sel;
      if (on) { px(6, y - 3, 116, 19, "#26314a"); selFrame(6, y - 3, 116, 19); }
      px(14, y + 2, 8, 8, h.body);
      px(14, y + 2, 8, 2, h.dark);
      text(h.name, 28, y, on ? "#f5e9b8" : "#cfd4e8", 10);
      textR("×" + h.odds, 116, y + 1, on ? "#e8c860" : "#8a92ad", 9);
    });
    textC("赔率越高越冷门", 64, 112, "#5a6078", 7);
    return;
  }

  /* 定注 */
  if (st.phase === "bet") {
    const h = HORSES[st.sel], bet = RACE_BETS[st.betIdx];
    px(30, 30, 10, 10, h.body); px(30, 30, 10, 3, h.dark);
    textC(h.name + " · 赔率 ×" + h.odds, 64, 45, "#f5e9b8", 11);
    RACE_BETS.forEach((b, i) => {
      const x = 12 + i * 26, on = i === st.betIdx, can = b <= S.coins;
      px(x, 66, 24, 16, on ? "#3a3f54" : "#22263a");
      if (on) selFrame(x, 66, 24, 16);
      textC(String(b), x + 12, 70, !can ? "#5a6078" : on ? "#f5e9b8" : "#cfd4e8", 9);
    });
    textC("押中得 " + Math.round(bet * h.odds * (hasEq("t_jade") ? 1.2 : 1)) + " 金", 64, 94, "#e8c860", 9);
    return;
  }

  /* 跑道：4 条，先到 x=112 者胜 */
  for (let i = 0; i < 4; i++) {
    const y = 20 + i * 20, h = HORSES[i], mine = i === st.sel;
    px(4, y, 120, 17, i % 2 ? "#1a1f30" : "#1e2338");
    if (mine) px(4, y, 120, 1, "#8a7440");                       // 我押的那道打金线
    px(112, y, 2, 17, "#cfd4e8");                                // 终点
    for (let k = 2; k < 17; k += 4) px(112, y + k, 2, 2, "#141824");
    drawHorse(9 + Math.round(st.hs[i].pos * 0.95), y + 5, h, st.phase === "race");
    if (st.phase === "result" && i === st.winner) text("冠", 117, y + 3, "#e8c860", 7);
  }

  if (st.phase === "race") {
    textC("押 " + HORSES[st.sel].name + " · " + RACE_BETS[st.betIdx] + " 金", 64, 106, "#e8c860", 9);
  } else {
    px(0, 100, W, 28, "#0f1420");
    textC(HORSES[st.winner].name + " 夺冠", 64, 102, "#f5e9b8", 10);
    if (st.win) textC("押中！+" + st.pay + " 金", 64, 115, "#b8e88a", 9);
    else        textC("没押中 -" + st.pay + " 金", 64, 115, "#e8a08a", 9);
  }
}

/* ================= 输入 ================= */
function moveSel(d) {
  // 按当前页面分发：背包/商城列表用各自索引，详情页连续翻物品，设置页按层级分发
  if (page === "item") {
    const order = filteredOrder(itemFrom);
    const i = ((itemFrom === "shop" ? shopSel : bagSel) + d + order.length) % order.length;
    if (itemFrom === "shop") shopSel = i; else bagSel = i;
    beep(620, .03, "square", .06); return;
  }
  if (page === "bag" || page === "shop") {
    const isShop = page === "shop";
    const order = filteredOrder(page);
    let sel = isShop ? shopSel : bagSel;
    if (catMode) {   // 分类标签行：▲▼ 只换分类（v8.1：不再顶格进出）
      const idx = Math.max(0, CATS.findIndex(c => c.id === (isShop ? shopCat : bagCat)));
      const n = ((idx + d) % CATS.length + CATS.length) % CATS.length;
      if (isShop) { shopCat = CATS[n].id; shopSel = 0; } else { bagCat = CATS[n].id; bagSel = 0; }
      beep(700, .03, "square", .06);
      return;
    }
    sel = (sel + d + order.length) % order.length;
    if (isShop) shopSel = sel; else bagSel = sel;
    beep(600, .03, "square", .06); return;
  }
  if (page === "settings") {
    if (!setPage) { setIdx = (setIdx + d + SET_MENU.length * 10) % SET_MENU.length; beep(600, .03, "square", .06); }
    else if (setPage === "wifi" && wifiState.phase === "list") {
      wifiState.sel = Math.max(0, Math.min(wifiState.list.length - 1, wifiState.sel + d));
      beep(600, .03, "square", .06);
    }
    return;
  }
  if (page === "game") {
    const st = gameSt;
    if (st.game === "hub") { st.sel = (st.sel + d + GAMES.length * 10) % GAMES.length; beep(600, .03, "square", .06); }
    else if (st.game === "dice") {
      if (st.phase === "side") { st.side = 1 - st.side; beep(600, .03, "square", .06); }
      else if (st.phase === "bet") {
        const maxIdx = BETS.findIndex(b => b > S.coins);   // 只能押身上有的
        const cap = maxIdx === -1 ? BETS.length - 1 : Math.max(0, maxIdx - 1);
        st.betIdx = Math.max(0, Math.min(cap, st.betIdx + d));
        beep(600, .03, "square", .06);
      }
    }
    else if ((st.game === "whack" || st.game === "memory") && st.phase === "play") {
      st.cur = Math.max(0, Math.min(5, st.cur + d));       // ◀▶ 移动锤子/选牌
      beep(600, .03, "square", .06);
    }
    else if (st.game === "race") {
      if (st.phase === "pick") { st.sel = (st.sel + d + 4) % 4; beep(600, .03, "square", .06); }
      else if (st.phase === "bet") {
        const cap = Math.max(0, RACE_BETS.filter(b => b <= S.coins).length - 1);
        st.betIdx = Math.max(0, Math.min(cap, st.betIdx + d));
        beep(600, .03, "square", .06);
      }
    }
    return;
  }
  if (page === "activity") {
    const rows = activityRows();
    actSel = Math.max(0, Math.min(rows.length - 1, actSel + d));
    beep(600, .03, "square", .06); return;
  }
  if (page === "home") {
    // 家园页 ▲▼ 在「升级 / 打扫」之间切换（打扫已并入家园）
    const opts = homeOptions();
    if (opts.length > 1) { homeSel = (homeSel + 1) % opts.length; beep(600, .03, "square", .06); }
    return;
  }
  if (page !== "main") return;
  // v0.2.0：主页 ▲▼（←→ 同效）在底部 4 个按钮间左右循环，不选中状态项
  const NAV_N = MENU.length - 1;
  if (menuIdx >= NAV_N) menuIdx = 0;
  menuIdx = (menuIdx + d + NAV_N * 10) % NAV_N;
  const m = MENU[menuIdx];
  selHint = { text: m.label + " · " + m.desc, until: Date.now() + 2000 };   // 切换后显示 2 秒再消失（v7.9）
  beep(600, .03, "square", .06);
}
/* ---- 菜单自动收起（已弃用：多画面布局下图标常驻）---- */
let menuHideAt = 0;
function pokeMenu() { menuHideAt = Date.now() + 4500; }
function menuOpen() { return true; }

function confirmA() {
  if (page === "boot") {          // 开机画面按 A → 进门派选择
    page = "sect"; sfx.up();
    for (let i = 0; i < 8; i++) sparkles.push({ x: 30 + Math.random() * 68, y: 30 + Math.random() * 50, life: 25 + Math.random() * 15 });
    return;
  }
  if (page === "sect") {
    const keys = Object.keys(SECTS);
    S.sect = keys[menuIdx % keys.length];
    S._lastTitle = titleOf(S.exp).t;
    page = "main";
    toastMsg("拜入" + SECTS[S.sect].name + "！江湖路远，多多关照", sfx.up);
    save();
  } else if (page === "main") {
    const id = MENU[menuIdx % MENU.length].id;
    doAct(id);
  } else if (page === "bag" || page === "shop") {
    if (catMode) { catMode = false; sfx.ok(); return; }          // 分类行 A = 确认回列表
    itemFrom = page; catMode = false; page = "item"; sfx.ok();   // 列表 → 详情
  } else if (page === "item") {
    const order = filteredOrder(itemFrom);
    const gid = order[Math.max(0, Math.min(itemFrom === "shop" ? shopSel : bagSel, order.length - 1))];
    const g = GOODS[gid];
    if (!g) return;
    if (itemFrom === "shop") {
      if (S.coins < g.price) { toastMsg("金币不足，还差 " + (g.price - S.coins) + " 金", sfx.err); return; }
      S.coins -= g.price;
      if (g.type === "deco") {   // 装饰：购入即布置庭院，不进行囊
        S.decos[gid] = true;
        toastMsg("购得「" + g.name + "」，已布置在庭院", sfx.ok);
      } else {
        S.bag[gid] = (S.bag[gid] || 0) + 1;
        toastMsg("购得「" + g.name + "」！已放入行囊", sfx.ok);
      }
      save();
    } else if (g.type === "food") doAct("eat", gid);
    else if (g.type === "med") doAct("useMed");
    else if (g.type === "use") doAct("usePage", gid);
    else if (g.type === "equip") doAct("equipToggle", gid);
    else if (g.type === "deco") toastMsg("「" + g.name + "」已在庭院布置妥当", null);
    else if (g.sell) doAct("sell", gid);
  } else if (page === "settings") {
    if (!setPage) {
      setPage = SET_MENU[setIdx].id; sfx.ok();
      if (setPage === "wifi" && wifiState.phase === "idle" && !wifiState.ssid) wifiScan();
    } else if (setPage === "ota") {
      if (otaState.phase === "idle" || otaState.phase === "fail") otaCheck();
      else if (otaState.phase === "found") otaUpgrade();
    } else if (setPage === "wifi") {
      if (wifiState.phase === "idle") wifiScan();
      else if (wifiState.phase === "list") wifiConnect(wifiState.list[wifiState.sel]);
      else if (wifiState.phase === "ok") { wifiReset(); toastMsg("已断开 WiFi", null); }
      else if (wifiState.phase === "fail") wifiScan();
    } else if (setPage === "ap") {
      apOn = !apOn;
      toastMsg(apOn ? "热点已开启：JX3-Tama-9027" : "热点已关闭", apOn ? sfx.ok : null);
    } else if (setPage === "sound") {
      setMuted(!muted);
      toastMsg(muted ? "音效已关闭" : "音效已开启", muted ? null : sfx.ok);
    }
  } else if (page === "game") {
    const st = gameSt;
    if (st.game === "hub") { gameStart(GAMES[st.sel].id); return; }   // 大厅 A = 进入所选游戏
    if (st.game === "dice") {
      if (st.phase === "side") { st.phase = "bet"; sfx.ok(); }
      else if (st.phase === "bet") {
        const bet = BETS[st.betIdx];
        if (S.coins < bet) { toastMsg("金币不够押这一注，调小点", sfx.err); return; }
        st.phase = "roll"; st.t = 0; st.dice = [1, 1, 1]; st.sum = 0;   // A 开骰！
      }
      else if (st.phase === "result") {
        if (S.coins < 50) { toastMsg("本钱不够了，赌坊老板请你出去", sfx.err); gameExit(); return; }
        st.phase = "side"; beep(600, .05);
      }
      return;
    }
    if (st.game === "whack") {
      if (st.phase === "over") { gameExit(); return; }
      st.swings++;
      if (st.cur === st.mole) {                                        // 敲中！
        const gain = 8 + Math.floor(Math.random() * 8);
        S.coins += gain; st.hits++; st.pay += gain;
        st.pop = "+" + gain + "金"; st.popT = 12; sfx.up();
        st.mole = Math.floor(Math.random() * 6);
        st.next = st.t + 26 + Math.floor(Math.random() * 30);
        if (st.hits >= 10) {                                           // 一轮结束
          const pen = actPenalty();
          st.pay = Math.max(1, Math.round(st.pay * pen));
          S.exp += 3; checkTitle();
          st.phase = "over"; S.cool["g_whack"] = Date.now() + 60000; save();
          toastMsg("地鼠敲完，收获 " + st.pay + " 金！" + (hasEq("t_jade") ? "" : ""), sfx.up);
        }
      } else { st.pop = "空竿！"; st.popT = 10; sfx.err(); }
      return;
    }
    if (st.game === "fish") {
      if (st.phase === "over") { gameExit(); return; }
      st.cast--;
      if (st.pos >= st.zoneL && st.pos < st.zoneL + st.zoneW) {        // 收在绿区：钓到！
        const gain = 25 + Math.floor(Math.random() * 36);
        S.coins += gain; st.gain += gain; st.good++;
        st.pop = "+" + gain + "金"; st.popT = 14; sfx.up();
        S.exp += 1; checkTitle();
      } else { st.pop = "跑了…"; st.popT = 12; sfx.err(); }
      if (st.cast <= 0) {                                              // 3 杆结算
        const pen = actPenalty();
        st.gain = Math.max(0, Math.round(st.gain * pen));
        if (st.good === 3) { S.coins += 30; st.gain += 30; }           // 三连中奖励
        st.phase = "over"; S.cool["g_fish"] = Date.now() + 45000; save();
      } else { st.zoneL = 6 + Math.floor(Math.random() * 9); st.pos = 0; st.dir = 1; }
      return;
    }
    if (st.game === "memory") {
      if (st.phase === "over") { gameExit(); return; }
      if (st.done[st.cur] || st.open.indexOf(st.cur) >= 0) { sfx.err(); return; }
      if (st.first < 0) { st.first = st.cur; st.open = [st.cur]; beep(600, .03, "square", .06); return; }
      st.open.push(st.cur);                                            // 第二张
      if (st.faces[st.first] === st.faces[st.cur]) {                   // 配对成功
        st.done[st.first] = true; st.done[st.cur] = true;
        st.matched++; st.pay += 15; S.coins += 15;
        st.pop = "+15金"; st.popT = 12; sfx.up();
        st.open = []; st.first = -1;
        if (st.matched >= 3) {                                         // 全配对大奖
          st.pay += 30; S.coins += 30; S.exp += 3; checkTitle();
          st.phase = "over"; S.cool["g_memory"] = Date.now() + 90000; save();
        }
      } else { st.wait = 26; st.first = -1; sfx.err(); }               // 不匹配：稍后盖回
      return;
    }
    if (st.game === "race") {
      if (st.phase === "pick") {
        st.phase = "bet";
        st.betIdx = Math.max(0, Math.min(st.betIdx, RACE_BETS.filter(b => b <= S.coins).length - 1));
        sfx.ok();
      } else if (st.phase === "bet") {
        const bet = RACE_BETS[st.betIdx];
        if (S.coins < bet) { toastMsg("金币不够押这一注，调小点", sfx.err); return; }
        st.phase = "race"; st.t = 0; st.winner = -1; st.win = false; st.pay = 0;
        st.hs = [0, 1, 2, 3].map(() => ({ pos: 0, burst: 0 }));
        beep(880, .08);
      } else if (st.phase === "result") {
        if (S.coins < RACE_BETS[0]) { toastMsg("盘缠不够了，马场伙计请你出去", sfx.err); gameExit(); return; }
        st.phase = "pick"; st.winner = -1; st.win = false; st.pay = 0;
        st.hs = [0, 1, 2, 3].map(() => ({ pos: 0, burst: 0 }));
        beep(600, .05);
      }
      return;
    }
    gameExit();
  } else if (page === "home") {
    const opts = homeOptions();
    if (homeSel >= opts.length) homeSel = 0;
    const act = opts[homeSel];
    if (act === "clean") {
      S.mess = 0; S.mood = Math.min(100, S.mood + 5); S.exp += 1;
      toastMsg("打扫完毕，窗明几净（修为+1）", sfx.ok);
      save();
      return;   // 留在家园页，狼藉清零后选项自动变回升级
    }
    if (act === "nanny") {   // 保姆代管（v7.6）：100 金雇 8 游戏时辰
      if (S.nannyGH > 0) { toastMsg("保姆正在照料中（还剩 " + Math.ceil(S.nannyGH) + " 时辰）", sfx.ok); return; }
      if (S.coins < 100) { toastMsg("雇佣保姆需要 100 金币", sfx.err); return; }
      S.coins -= 100; S.nannyGH = 8;
      toastMsg("已雇保姆 8 时辰：代管起居、自动洒扫、夜免惊扰", sfx.up);
      save();
      return;   // 留在家园页，能看到保姆小人
    }
    const cost = (S.homeLv + 1) * 500;
    if (S.homeLv >= 4) { toastMsg("家园已至「山庄」，此乃极致", sfx.err); return; }
    if (S.coins < cost) { toastMsg("金币不足，还差 " + (cost - S.coins) + " 金", sfx.err); return; }
    S.coins -= cost; S.homeLv++;
    toastMsg("家园升为「" + HOME_NAMES[S.homeLv] + "」！心情更稳了", sfx.up);
    for (let i = 0; i < 12; i++) sparkles.push({ x: 20 + Math.random() * 88, y: 25 + Math.random() * 60, life: 30 + Math.random() * 20 });
    save();
  } else if (page === "status") {
    // v8.2：手札只认 B 返回；A 不再退出（原来 A 也能退，和底部「B 返回」提示不一致）
    beep(440, .05);
  } else if (page === "activity") {
    const rows = activityRows();
    const row = rows[actSel];
    if (row && row.kind === "act") { doAct(row.id); return; }        // 行动：打坐/木桩/挖宝/家园
    if (row && row.kind === "daily" && row.key && DUNGEON_KEYS[row.key]) {
      page = "main";
      startDungeon(DUNGEON_KEYS[row.key]);                            // 日常可打本条目 → 进副本
    } else {
      fetchDaily();
      toastMsg("已刷新今日日常", sfx.ok);
    }
  }
}
/* v8.0：随时打开系统设置——真机只有 4 键，没有独立设置键，
   约定「长按 B（返回键）1.5 秒」全局呼出设置，短按 B 仍是返回（v8.3：500ms→1500ms，防误触）。
   记录来源页，B 返回时回到原页面（游戏摇骰/背包分类行等状态都不丢）。 */
const B_HOLD_MS = 1500;                                 // v8.3：长按阈值 1.5 秒
let bHoldTimer = 0, bHoldFired = false;
function openSettings() {
  if (page === "settings") return;                     // 已在设置页不重复进入
  settingsFrom = page;
  page = "settings"; setIdx = 0; setPage = null;
  sfx.ok();
}
function bHoldStart() {
  bHoldFired = false;
  clearTimeout(bHoldTimer);
  bHoldTimer = setTimeout(() => { bHoldFired = true; openSettings(); }, B_HOLD_MS);
}
function bHoldCancel() {
  clearTimeout(bHoldTimer); bHoldTimer = 0;
  return bHoldFired;                                   // true = 长按已触发，本次点击吞掉
}

function pressB() {
  if (page === "settings") {
    if (setPage) { setPage = null; beep(440, .05); }   // 子页 → 设置菜单
    else { page = settingsFrom; beep(440, .05); }      // 回来源页，不是固定主界面
    return;
  }
  if (page === "game") {
    const st = gameSt;
    if (st.game === "hub") { page = "main"; beep(440, .05); return; }     // 大厅 B = 回主页
    if (st.game === "dice") {
      if (st.phase === "bet") { st.phase = "side"; beep(440, .05); }      // 调注 → 退回选边
      else if (st.phase !== "roll") gameExit();                           // 摇骰中不许退出
      return;
    }
    if (st.game === "race") {
      if (st.phase === "bet") { st.phase = "pick"; beep(440, .05); }      // 定注 → 退回选马
      else if (st.phase !== "race") gameExit();                           // 起跑后不许退，押了就得看完
      return;
    }
    gameExit();                                                            // 小游戏 B = 回游戏厅（中途退出不给奖励）
    return;
  }
  if (page === "item") { page = itemFrom; catMode = false; beep(440, .05); return; }   // 详情 → 列表
  if (page === "bag" || page === "shop") {
    // v8.1：列表 B 退回分类栏（反向操作），分类栏 B 才回主页
    if (!catMode) { catMode = true; beep(440, .05); return; }
    page = "main"; catMode = false; beep(440, .05);
  }
  else if (page === "status") { page = "main"; beep(440, .05); }   // v8.2：手札 B 明确返回主页（A 不退出）
  else if (page === "home" || page === "activity") { page = "main"; beep(440, .05); }
  else if (page === "main") { page = "status"; sfx.ok(); }   // B 在主页 = 快捷看状态
}

/* ---- 4 实体键（机身下方）：▲▼ 选单 / A 确认 / B 返回 ----
   ▲▼ 支持长按连续滚动：按住 480ms 后每 110ms 触发一次（11 个菜单项真机上按单步太累） */
function bindHold(el, d) {
  let t1 = 0, t2 = 0;
  const stop = () => { clearTimeout(t1); clearInterval(t2); t1 = t2 = 0; };
  el.addEventListener("pointerdown", e => {
    e.preventDefault();
    moveSel(d);
    t1 = setTimeout(() => { t2 = setInterval(() => moveSel(d), 110); }, 480);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, stop));
}
bindHold(document.getElementById("btnUp"), -1);
bindHold(document.getElementById("btnDown"), 1);
document.getElementById("btnA").onclick = confirmA;
/* 实体 B 键：短按返回，长按 1.5 秒呼出设置（与键盘 B/Esc 同一约定）
   v8.3 修复：pointerup 才是「一次点击」的唯一出口；pointerleave/pointercancel
   只取消长按计时，绝不再调用 pressB —— 否则按一次会触发两次返回
   （主页 B 进手札后立即被 pointerleave 又退回、手札 B 退出又被拉回）。 */
(function bindBHold() {
  const el = document.getElementById("btnB");
  el.addEventListener("pointerdown", e => { e.preventDefault(); bHoldStart(); });
  el.addEventListener("pointerup", () => { if (!bHoldCancel()) pressB(); });   // 唯一触发点
  ["pointerleave", "pointercancel"].forEach(ev => el.addEventListener(ev, () => {
    clearTimeout(bHoldTimer); bHoldTimer = 0;          // 仅取消长按，不返回
  }));
})();
// 真实尺寸切换（1 canvas 像素 = 1 CSS 像素，即真机 1.44 寸屏的显示密度）
const sizeToggle = document.getElementById("sizeToggle");
function applyRealSize(on) {
  document.body.classList.toggle("real-size", on);
  sizeToggle.classList.toggle("on", on);
  sizeToggle.textContent = on ? "切换：自适应屏幕" : "切换：真实尺寸 128×128";
  try { localStorage.setItem("jx3realsize", on ? "1" : "0"); } catch (e) {}
}
sizeToggle.addEventListener("click", () => applyRealSize(!document.body.classList.contains("real-size")));
try { applyRealSize(localStorage.getItem("jx3realsize") === "1"); } catch (e) {}
const deviceEl = document.querySelector(".device");
// 滚轮在整个机身上都可用（选单旋转）
deviceEl.addEventListener("wheel", e => { e.preventDefault(); moveSel(e.deltaY > 0 ? 1 : -1); }, { passive: false });
// 屏幕上左右滑也能旋转（手机友好）
let swipeX = null;
cv.addEventListener("pointerdown", e => { swipeX = e.clientX; });
cv.addEventListener("pointermove", e => {
  if (swipeX === null) return;
  if (Math.abs(e.clientX - swipeX) > 24) { moveSel(e.clientX < swipeX ? 1 : -1); swipeX = e.clientX; }
});
cv.addEventListener("pointerup", () => { swipeX = null; });
cv.addEventListener("pointercancel", () => { swipeX = null; });
window.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;      // 放过 Ctrl+R 等浏览器快捷键
  const now = Date.now();
  let hit = true;
  if (e.key === "ArrowLeft" || e.key === "ArrowUp") { if (now >= selectLock) { moveSel(-1); selectLock = now + 90; } }
  else if (e.key === "ArrowRight" || e.key === "ArrowDown") { if (now >= selectLock) { moveSel(1); selectLock = now + 90; } }
  else if (e.key === "Enter" || e.key === " ") confirmA();
  else if (e.key === "Escape" || e.key === "b" || e.key === "B") { if (!e.repeat) bHoldStart(); }
  else hit = false;
  if (hit) e.preventDefault();                         // 只吞游戏按键，F5 / F12 / Tab 照常
});
window.addEventListener("keyup", e => {
  if (e.key === "Escape" || e.key === "b" || e.key === "B") {
    e.preventDefault();
    if (!bHoldCancel()) pressB();                      // 短按 = 返回；长按 1.5 秒 = 设置
  }
});

/* ================= 面板控件 ================= */
document.getElementById("speed").onchange = e => speedF = +e.target.value;
document.getElementById("mute").onchange = e => setMuted(e.target.checked);
setMuted(muted);   // 初始化：载入本地静音偏好并同步面板复选框
// 真机预览：30fps 节拍 + 屏幕轻微提亮（v8.6 起机身配色不再改暖，对齐 ST7735 实际刷新能力）
const qEl = document.getElementById("qmode");
function applyQmode(on) {
  qmode = !!on;
  document.body.classList.toggle("qmode", qmode);
  if (qEl) qEl.checked = qmode;
  try { localStorage.setItem("jx3qmode", qmode ? "1" : "0"); } catch (e) {}
}
if (qEl) qEl.onchange = e => applyQmode(e.target.checked);
try { applyQmode(localStorage.getItem("jx3qmode") === "1"); } catch (e) {}

/* v8.5：已移除 v8.4 的暖屏 QLUT 色域映射。真机预览改回明亮配色，
   不再逐帧改写像素（getImageData/putImageData），仅 CSS 轻微提亮。 */
document.getElementById("reset").onclick = () => {
  if (confirm("确定清档重开？侠士的江湖岁月将归零。")) {
    localStorage.removeItem("jx3tama");
    S = newState(); page = "boot"; menuIdx = 0;   // 清档回到开机 LOGO 画面
  }
};

/* ================= 主循环 ================= */
if (!load()) { S = newState(); page = "boot"; }   // 新档先看开机 LOGO
else {
  page = "main"; S._lastTitle = titleOf(S.exp).t;
  checkDailyLogin();                              // 每日登录奖励（跨天自动发）
  wasSleep = isSleeping();
  if (S._awayHours > 0.5) {                        // 归来：给离线一个叙事，而不是静默掉数值
    toastMsg("你离开了 " + Math.round(S._awayHours * 10) / 10 + " 个时辰，侠士有些想你", sfx.ok);
  }
  S._awayHours = 0;
}
speedF = +document.getElementById("speed").value;

let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  const dt = (now - lastTick) / 1000;
  lastTick = now;
  if (page !== "sect" && page !== "boot") applyTime(dt, speedF, false);   // 开机/选门派时时间不走
  checkDailyLogin();   // 页面开着跨天也能领签到
  save();
}, 1000);

(function loop(ts) {
  requestAnimationFrame(loop);
  if (qmode) {                                    // 真机预览：锁 30fps
    if (ts - lastFrameTs < 1000 / 30) return;
    lastFrameTs = ts;
  }
  render();
})();
</script>
